<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>서울, 잔류자</title>
<style>
:root{--bg:#0d0f12;--ink:#ece7db;--dim:#9b968a;--accent:#e6b94c;--red:#e0574d;--green:#7fbf6a;--blue:#5aa7e0;--panel:rgba(20,22,26,.96);--line:rgba(255,255,255,.13)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{display:block;position:fixed;inset:0;width:100%;height:100%;z-index:1}
button{font:inherit;color:inherit;cursor:pointer}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(6px + env(safe-area-inset-top)) 8px 0;pointer-events:none;display:flex;flex-direction:column;gap:5px;z-index:5}
#hud .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#bars{display:grid;grid-template-columns:auto 1fr auto;gap:3px 6px;align-items:center;font-size:11px;width:min(52vw,210px);background:rgba(0,0,0,.5);padding:5px 8px;border-radius:9px}
#bars span{color:var(--dim);white-space:nowrap}
#bars b{font-weight:600;font-size:10px;min-width:22px;text-align:right}
.bar{height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:50%;transition:width .2s}
#info{text-align:right;font-size:12px;background:rgba(0,0,0,.5);padding:5px 9px;border-radius:9px;line-height:1.5;pointer-events:auto}
#clock{font-size:15px;font-weight:700;color:var(--accent)}
#clock.night{color:#8fa8ff}
#pausebtn,#mapbtn,#invbtn,#lightbtn{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:6px;padding:1px 7px;font-size:11px;margin-top:2px}
#toasts{position:fixed;top:calc(112px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:6;width:92vw}
.toast{background:rgba(0,0,0,.72);padding:5px 12px;border-radius:14px;font-size:13px;animation:tf 2.8s forwards;text-align:center}
.toast.red{color:#ffb2aa;border:1px solid rgba(224,87,77,.5)}
.toast.gold{color:#ffe19a}
.toast.green{color:#c6efb8}
@keyframes tf{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#sms{position:fixed;left:50%;top:calc(6px + env(safe-area-inset-top));transform:translate(-50%,-140%);width:min(440px,94vw);z-index:30;background:rgba(22,24,28,.97);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.6);overflow:hidden;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);pointer-events:auto}
#sms.on{transform:translate(-50%,0)}
#sms .sh{display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:12px;font-weight:700;color:#fff;background:#b3261e}
#sms.safe .sh{background:#a87a0b}
#sms .sh small{margin-left:auto;font-weight:400;opacity:.8}
#sms .sb{padding:8px 12px 10px;font-size:13px;line-height:1.5;color:#eee}
#sms .sb b{color:#ffcf8a}
#prompt{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(0,0,0,.7);border:1px solid rgba(230,185,76,.5);padding:6px 14px;border-radius:16px;font-size:13px;pointer-events:none;z-index:5;white-space:nowrap;display:none}
body:not(.touch) #prompt{bottom:86px}
#joyzone,#btns{display:none}
body.touch #joyzone{display:none;position:fixed;left:0;bottom:0;width:50%;height:55%;z-index:4}
#joy{position:absolute;width:112px;height:112px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);left:26px;bottom:calc(26px + env(safe-area-inset-bottom));pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.28)}
body.touch #btns{display:grid;position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));grid-template-columns:62px 80px;grid-template-rows:62px 80px;gap:10px;z-index:5}
#btns button{border-radius:50%;border:2px solid rgba(255,255,255,.22);background:rgba(0,0,0,.45);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:0}
#btns button span{font-size:20px}
#bAtk{grid-column:2;grid-row:2;background:rgba(160,50,40,.55)!important}
#bRun.on{background:rgba(230,185,76,.45)!important}
#modal,#screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;background:rgba(0,0,0,.55);padding:10px}
#modal.on,#screen.on{display:flex}
.win{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.whead{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.whead h2{margin:0;font-size:17px}
.whead small{color:var(--dim);font-size:12px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:8px 0;font-size:13px;color:var(--dim);border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.wbody{padding:10px 14px;overflow:auto;flex:1;min-height:0;font-size:13px}
.wfoot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.wfoot button,.btn{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.07);border-radius:10px;padding:9px 6px;font-size:14px}
.btn.pri,.wfoot .pri{background:#7a5a1c;border-color:#c99a3a;color:#fff3d4}
.list{display:flex;flex-direction:column;gap:5px}
.it{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.04)}
.it .nm{flex:1;min-width:0}
.it .nm small{display:block;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it button{border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:7px;padding:4px 10px;font-size:12px;min-width:34px}
.it button:disabled{opacity:.35}
.cnt{color:var(--accent);font-weight:700;min-width:22px;text-align:center}
.mats{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--dim);font-size:12px;margin-bottom:8px}
.mats b{color:var(--ink)}
.stat{display:grid;grid-template-columns:52px 1fr 34px;gap:6px;align-items:center;margin:4px 0}
.stat .bar{height:9px}
.no{color:var(--red)}
.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.bagwrap{display:flex;gap:6px;align-items:flex-start;justify-content:center}
.bag{--c:34px;display:grid;grid-template-columns:repeat(var(--gw),var(--c));grid-template-rows:repeat(var(--gh),var(--c));gap:2px;padding:4px;background:#0d0e14;border:1px solid var(--line);border-radius:6px}
.bag .gc{background:#1b1c24;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.bag .gi{position:relative;z-index:1;margin:0;border:1px solid rgba(255,255,255,.22);background:#2a2c38;border-radius:3px;display:flex;align-items:center;justify-content:center;padding:0}
.bag .gi.sel{border-color:var(--accent);background:#3d3622}
.bag .gi em{position:absolute;right:2px;bottom:0;font-style:normal;font-size:10px;font-weight:700;color:var(--accent)}
.bag{touch-action:none;position:relative}.bag .gi{cursor:grab;touch-action:none}
.bag .prev{z-index:2;border:2px dashed #7fe08a;background:rgba(127,224,138,.18);border-radius:3px;pointer-events:none}.bag .prev.bad{border-color:#e0574d;background:rgba(224,87,77,.2)}
.gi.ghost{position:fixed;z-index:60;pointer-events:none;opacity:.92;background:#2a2c38;border-radius:3px;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.6);border:1px solid #ffd76a}.gi.ghost.ok{border:2px solid #7fe08a}
.sortbtn{display:flex;flex-direction:column;gap:4px}.sortbtn button{border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:6px;padding:6px 8px;font-size:12px}
@media (min-width:600px){.bag{--c:40px}}
@media (max-width:380px){.bag{--c:30px}}
.win.inv .wbody{display:flex;flex-direction:column;gap:8px}
.slots,.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:5px}
.ic{position:relative;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:7px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;min-height:52px}
.ic span{font-size:20px;line-height:1}.ic small{font-size:9px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ic em{position:absolute;right:4px;top:2px;font-style:normal;font-size:11px;font-weight:700;color:var(--accent)}
.ic.sel{border-color:var(--accent);background:rgba(230,185,76,.15)}.ic.slot{background:rgba(90,120,160,.12)}
.ic .dur{position:absolute;left:4px;bottom:3px;height:2px;background:#7fbf6a;max-width:calc(100% - 8px)}
.wrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:12px;color:var(--dim)}.wrow b{color:var(--ink)}
.desc{font-size:12px;line-height:1.5;color:#cfcac0;margin:0}.acts{display:flex;gap:6px;flex-wrap:wrap}.acts button{border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:8px;padding:6px 10px;font-size:12px}
.btn.x{flex:0 0 auto;padding:4px 10px}
.ctabs{display:flex;gap:4px;margin-bottom:6px}.ctabs button{flex:1;padding:5px 0;white-space:nowrap;min-width:0;overflow:hidden;border-radius:7px;border:1px solid var(--line);background:#1a1b20;color:var(--dim);font-size:12px}.ctabs button.on{background:#3a2d12;color:#ffd98a;border-color:#7a5a1c}
.craft .chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}.chip{font-size:10px;padding:0 4px;border-radius:5px;background:#24252b;color:#cfd2d8;white-space:nowrap}.chip.lack{color:#ff8a7a;background:#3a1c1c}.chip.tool{background:#2b2414;color:#ffd27a}
.craft{gap:3px!important}@media (max-width:480px){.craft .it{padding:1px 6px}.craft .it button{padding:3px 7px}.craft .nm{line-height:1.28}}@media (min-width:640px){.list.craft{display:grid!important;grid-template-columns:1fr 1fr}.list.craft .unk{grid-column:1/-1}}.craft .it{padding:3px 8px}.craft .nm{font-size:13px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.craft .nm .d{font-size:10.5px;color:var(--dim)}.craft .chips{flex-wrap:nowrap!important;overflow:hidden}.craft .it button{padding:4px 8px;font-size:12px}
.craft .unk .nm{color:#6d6f78}.craft img.px{display:inline-block!important;vertical-align:-3px}
.goalbox{border:1px solid rgba(230,185,76,.5);background:rgba(230,185,76,.08);border-radius:10px;padding:10px;margin:10px 0;display:flex;flex-direction:column;gap:3px}
.goalbox small{color:var(--accent);font-size:11px}.goalbox b{font-size:15px}.goalbox span{font-size:12px;color:var(--dim)}
.steps{display:flex;flex-direction:column;gap:6px;text-align:left}.steps div{display:grid;grid-template-columns:24px 1fr;column-gap:8px;align-items:center;background:rgba(255,255,255,.04);border-radius:8px;padding:6px 8px}
.steps i{grid-row:span 2;font-style:normal;width:22px;height:22px;border-radius:50%;background:#7a5a1c;color:#fff3d4;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}.steps b{font-size:13px}.steps span{font-size:11px;color:var(--dim)}
.help h2{margin:6px 0 8px;font-size:20px}.help .hb{text-align:left;color:var(--ink);font-size:13px;line-height:1.7;min-height:120px}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 10px}.dots i{width:8px;height:8px;border-radius:50%;background:#444;cursor:pointer}.dots i.on{background:var(--accent)}
#goal{pointer-events:auto;align-self:flex-start;max-width:min(330px,92vw);background:rgba(8,8,12,.84);border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-size:11px;line-height:1.55;cursor:pointer}
#goal .gh{font-weight:700;color:var(--accent);font-size:12px}#goal .gh small{color:var(--dim);font-weight:400}
#goal .done{color:#7d9a74;text-decoration:line-through}#goal .cur{color:#fff}#goal div:not(.gh):not(.cur):not(.done){color:var(--dim)}#goal .td{color:#ffd79a;margin-top:2px}#goal .sv{color:#9fd7ff}
@media (max-height:500px){#goal{font-size:10px;max-width:300px}
 .win.big .steps{flex-direction:row}.win.big .steps div{flex:1}.win.big .goalbox{margin:6px 0}.win.big h1{margin:0;font-size:26px}.win.big>p.sub{display:none}.win.big .steps span{display:none}.win.big .warnp{margin:4px 0}.help .hb{min-height:0}}
.ln{display:flex;justify-content:space-between;position:relative;padding:10px 14px 2px}
.ln:before{content:'';position:absolute;left:44px;right:44px;top:17px;height:4px;background:#d8691c;border-radius:2px}
.ln .st{position:relative;text-align:center;font-size:11px;width:68px;color:#888}
.ln .st i{display:block;margin:0 auto 3px;width:12px;height:12px;border-radius:50%;border:3px solid #d8691c;background:#14161a}
.ln .st.v{color:#ccc}.ln .st.v i{background:#d8691c}
.ln .st.cur{color:#fff;font-weight:700}.ln .st.cur i{background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.big{max-width:420px;text-align:center;padding:22px 20px}
.big h1{margin:0 0 4px;font-size:34px;letter-spacing:.06em;font-family:"Nanum Myeongjo","Batang",serif}
.big p{color:var(--dim);line-height:1.6;font-size:13px;margin:8px 0}
.big .keys{font-size:12px;color:var(--dim);text-align:left;background:rgba(255,255,255,.04);border-radius:8px;padding:8px 12px;line-height:1.7}
.big .btn{display:block;width:100%;margin-top:10px}
body:not(.ingame) #hud,body:not(.ingame) #btns,body:not(.ingame) #joyzone,body:not(.ingame) #prompt{display:none!important}
#mini{display:block;width:110px;height:110px;border-radius:8px;border:1px solid var(--line);margin:4px 0 4px auto;cursor:pointer;background:#08080c}
#info .ib{display:flex;gap:4px;justify-content:flex-end}
#hotbar{display:flex;gap:4px;pointer-events:auto;justify-content:center}
#hotbar button{position:relative;width:40px;height:40px;border:1px solid rgba(255,255,255,.18);background:rgba(10,10,16,.75);border-radius:8px;padding:0;display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1}
#hotbar button:disabled{opacity:.35}
#hotbar b{position:absolute;left:3px;top:1px;font-size:9px;color:var(--dim)}
#hotbar em{position:absolute;right:3px;bottom:1px;font-style:normal;font-size:10px;font-weight:700;color:var(--accent)}
#hotbar i{position:absolute;left:5px;right:5px;bottom:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden}
#hotbar i u{display:block;height:100%}
#hotbar .wp{width:52px;border-color:rgba(230,185,76,.6)}
#hotbar .on{border-color:#ffd76a;box-shadow:0 0 8px rgba(255,215,106,.55)}
#hotbar .gap{width:5px}
@media (min-width:600px){#hotbar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);gap:6px}#hotbar button{width:48px;height:48px;font-size:22px}#hotbar .wp{width:62px}#mini{width:150px;height:150px}}
@media (max-width:599px){body.ingame #hotbar{position:fixed;left:10px;bottom:calc(16px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,42px);gap:5px;z-index:5}#hotbar .gap{display:none}#hotbar button,#hotbar .wp{width:42px;height:42px}}
@media (max-height:500px){#mini{width:96px;height:96px}}
@media (max-width:380px){#hotbar button{width:35px;height:35px;font-size:16px}#hotbar .wp{width:44px}#bars{width:56vw}#mini{width:96px;height:96px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div class="row">
    <div id="bars">
      <span>❤ 체력</span><div class="bar"><i id="bHp" style="background:#e0574d"></i></div><b id="nHp"></b>
      <span>🍚 배고픔</span><div class="bar"><i id="bFood" style="background:#e6b94c"></i></div><b id="nFood"></b>
      <span>💧 갈증</span><div class="bar"><i id="bWater" style="background:#5aa7e0"></i></div><b id="nWater"></b>
      <span>☣ 감염</span><div class="bar"><i id="bInf" style="background:#9be05a"></i></div><b id="nInf"></b>
    </div>
    <div id="info"><div id="clock"></div><div id="bagn"></div><canvas id="mini" title="전체 지도"></canvas><div class="ib"><button id="mapbtn">🗺 지도</button><button id="pausebtn">Ⅱ</button></div></div>
  </div>
  <div id="hotbar"></div>
  <div id="goal"></div>
</div>
<div id="toasts"></div>
<div id="sms"></div>
<div id="prompt"></div>
<div id="joyzone"><div id="joy"><div id="knob"></div></div></div>
<div id="btns">
  <button id="bUse"><span>✋</span>뒤지기</button>
  <button id="bThrow"><span>🧨</span>폭죽</button>
  <button id="bRun"><span>🏃</span>달리기</button>
  <button id="bAtk"><span>⚔</span>공격</button>
</div>
<div id="modal"></div>
<div id="screen"></div>
<script>
'use strict';
/* ───────── 기본 상수 ───────── */
const T=32,MW=84,MH=100,DAY=240,NIGHT=150,BAG_CAP=18;
let HOME_TILE={x:0,y:0};
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, hyp=Math.hypot;
const angdiff=(a,b)=>{let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=Math.random;
const hash=(x,y)=>{let h=x*374761393+y*668265263;h=(h^(h>>>13))*1274126177;return((h^(h>>>16))>>>0)/4294967296};

/* ───────── 데이터 ───────── */
const ITEMS={
  can:{n:'통조림',food:35,ic:'🥫'}, ramen:{n:'라면',food:22,water:-6,ic:'🍜'}, veg:{n:'옥상 채소',food:18,water:4,ic:'🥬'},
  water:{n:'생수',water:40,ic:'💧'}, bandage:{n:'붕대',hp:30,ic:'🩹'}, anti:{n:'항생제',inf:-30,ic:'💊'}, fire:{n:'폭죽',ic:'🧨'},
  scrap:{n:'고철',ic:'🔩',mat:1}, cloth:{n:'천',ic:'🧵',mat:1}, wood:{n:'나무판',ic:'🪵',mat:1}, tape:{n:'테이프',ic:'🎞',mat:1}, parts:{n:'부품',ic:'⚙',mat:1},
  rat:{n:'쥐',ic:'🐀',raw:1}, pigeon:{n:'비둘기',ic:'🐦',raw:1},
  ratmeat:{n:'쥐고기',food:8,inf:12,ic:'🥩',rot:1,raw:1}, birdmeat:{n:'비둘기 고기',food:10,inf:10,ic:'🍗',rot:1,raw:1},
  knife:{n:'식칼',ic:'🔪',tool:1}, burner:{n:'휴대용 버너',ic:'🔥',tool:1}, butane:{n:'부탄가스',ic:'🧯',mat:1},
  rice:{n:'쌀',ic:'🌾',mat:1}, kimchi:{n:'김치',food:8,water:-3,ic:'🌶'}, spam:{n:'스팸',food:20,ic:'🥓'}, soju:{n:'소주',water:12,inf:-2,ic:'🍶'},
  skewer:{n:'쥐꼬치구이',food:22,inf:2,ic:'🍢',rot:2,dish:1}, ratramen:{n:'쥐고기 라면',food:42,water:4,ic:'🍜',rot:1,dish:1},

const walk=(tx,ty)=>tx>=0&&ty>=0&&tx<MW&&ty<MH&&!solid[ty*MW+tx];
const inRoad=(x,y,d)=>ROADS.some(r=>(!d||r.d===d)&&x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h);
function setSolid(x,y,w,h,blockSight){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++){solid[j*MW+i]=1;if(blockSight)sightB[j*MW+i]=1}}
function freeRect(x,y,w,h){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(i<1||j<1||i>=MW-1||j>=MH-1||solid[j*MW+i]||resv[j*MW+i])return false;return true}
function addCont(tx,ty,type,extra){conts.push(Object.assign({x:(tx+.5)*T,y:(ty+.5)*T,type,loot:null,empty:false},extra||{}))}
function pool(list){let a=[];return ()=>{if(!a.length){a=list.slice();for(let i=a.length-1;i>0;i--){const j=R()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}}return a.pop()}}

function gen(seed){
  R=mulberry32(seed);
  tile.fill(3);solid.fill(0);sightB.fill(0);mk.fill(0);resv.fill(0);
  buildings=[];cars=[];trees=[];conts=[];decals=[];exits=[];links=[];ZLABELS=[];
  const road=new Uint8Array(MW*MH);
  for(const r of ROADS)for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++){const i=y*MW+x;tile[i]=0;road[i]=1}
  for(const [ax,ay,aw,ah] of ALLEYS)for(let y=ay;y<ay+ah;y++)for(let x=ax;x<ax+aw;x++){const i=y*MW+x;if(!road[i]){tile[i]=3;road[i]=2}}
  for(let i=0;i<MW;i++){solid[i]=solid[(MH-1)*MW+i]=1}for(let j=0;j<MH;j++){solid[j*MW]=solid[j*MW+MW-1]=1}
  // 차선·버스차로·횡단보도
  for(const r of ROADS)for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++){
    const i=y*MW+x,other=inRoad(x,y,r.d==='v'?'h':'v');if(other)continue;
    if(r.d==='v'){const lx=x-r.x;
      if(r.k==='major'){if(lx===3||lx===4)tile[i]=4;if(lx===4)mk[i]|=4;else if(lx>0)mk[i]|=1}
      else if(lx===1)mk[i]|=64;
    }else{const ly=y-r.y;
      if(r.k==='major'){if(ly===(r.h>>1))mk[i]|=8;else if(ly>0)mk[i]|=2}
      else if(ly===1)mk[i]|=128;
    }
  }
  for(const v of ROADS)if(v.d==='v')for(const h of ROADS)if(h.d==='h'){
    if(h.x+h.w<v.x||h.x>v.x+v.w||v.y>h.y||v.y+v.h<h.y+h.h)continue;
    if(v.k!=='major'&&h.k!=='major')continue;
    for(const yy of [h.y-1,h.y+h.h])for(let x=v.x;x<v.x+v.w;x++)if(inRoad(x,yy,'v')&&!inRoad(x,yy,'h'))mk[yy*MW+x]|=16;
    for(const xx of [v.x-1,v.x+v.w])for(let y=h.y;y<h.y+h.h;y++)if(inRoad(xx,y,'h')&&!inRoad(xx,y,'v'))mk[y*MW+xx]|=32;
  }
  // 블록(길로 둘러싸인 땅) 찾기 → 보도 → 안쪽
  const comp=new Int32Array(MW*MH).fill(-1),blocks=[];
  for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){
    const s=y*MW+x;if(road[s]||comp[s]>=0)continue;
    const id=blocks.length,q=[s];comp[s]=id;const cells=[];
    while(q.length){const c=q.pop();cells.push(c);const cx=c%MW,cy=c/MW|0;
      for(const [nx,ny] of [[cx-1,cy],[cx+1,cy],[cx,cy-1],[cx,cy+1]]){if(nx<1||ny<1||nx>=MW-1||ny>=MH-1)continue;const n=ny*MW+nx;if(!road[n]&&comp[n]<0){comp[n]=id;q.push(n)}}}
    blocks.push(cells);
  }
  const inner=[];
  for(const cells of blocks){
    let x0=1e9,y0=1e9,x1=-1,y1=-1;
    for(const c of cells){const cx=c%MW,cy=c/MW|0;
      const side=(cx===34||cx===45)||[[cx-1,cy],[cx+1,cy],[cx,cy-1],[cx,cy+1]].some(([nx,ny])=>road[ny*MW+nx]===1);
      if(side)tile[c]=1;else{tile[c]=3;x0=Math.min(x0,cx);y0=Math.min(y0,cy);x1=Math.max(x1,cx);y1=Math.max(y1,cy)}}
    if(x1>=x0)inner.push([x0,y0,x1,y1]);
  }
  // 랜드마크
  for(const L of LANDMARKS){
    const b=Object.assign({lm:true},L,{door:{x:L.x+(L.w>>1),y:L.y+L.h},front:'major'});
    b.floors=floorsOf(b);buildings.push(b);setSolid(b.x,b.y,b.w,b.h,1);
    for(let x=b.x;x<b.x+b.w;x++)resv[b.door.y*MW+x]=1;
    addCont(b.door.x-1,b.door.y,b.loot,{label:b.sub||b.name});addCont(b.door.x+1,b.door.y,b.loot,{label:b.sub||b.name});
  }
  // 줄지어 선 건물: 블록 아래에서부터 한 줄씩, 줄 사이엔 한 칸 뒷골목
  const pickChain=pool(CHAIN),pickAlley=pool(ALLEY),pickOffice=pool(OFFICE);
  const frontOf=(x,y)=>{const t=tile[y*MW+x];if(t!==1)return 'alley';for(let k=1;k<=2;k++){const yy=y+k;if(yy>=MH)break;if(road[yy*MW+x]===1)return ROADS.find(r=>x>=r.x&&x<r.x+r.w&&yy>=r.y&&yy<r.y+r.h).k}return 'alley'};
  for(const [ix0,iy0,ix1,iy1] of inner){
    let yb=iy1;
    while(yb-iy0+1>=3){
      const remain=yb-iy0+1;
      let d=remain<=7?remain:remain<=10?Math.ceil((remain-1)/2):4+(R()*3|0);
      if(remain-d<3)d=remain;
      const top=yb-d+1;
      let x=ix0;
      while(x<=ix1){
        if(R()<.1&&x>ix0&&ix1-x>3){x++;continue}
        let w=3+(R()*5|0);if(ix1-x+1-w<3)w=ix1-x+1;
        let ok=false;
        for(let ww=w;ww>=3;ww--){if(freeRect(x,top,ww,d)&&!solid[(yb+1)*MW+x+(ww>>1)]){w=ww;ok=true;break}}
        if(!ok){x++;continue}
        addBuilding(x,top,w,d,frontOf(x+(w>>1),yb+1),pickChain,pickAlley,pickOffice);
        x+=w;
      }
      yb=top-2;
    }
  }
  // 지하철 출구
  for(const [x,y,n,s] of EXIT_DEF){
    if(!freeRect(x,y,1,2))continue;exits.push({x,y,n,st:STATIONS[s]});setSolid(x,y,1,2,0);
    const ly=solid[(y+2)*MW+x]?y-1:y+2;links.push({id:'g'+n,x,y:ly,to:'subway',dest:'s'+n,label:`${STATIONS[s].n} ${n}번 출구 · 지하로`,arrow:'▼'});
  }
  // 가로수 (강남대로 보도)
  for(const x of [35,44])for(let y=2;y<MH-2;y+=4){const i=y*MW+x;if(tile[i]!==1||solid[i]||solid[i-1]||solid[i+1]||resv[i])continue;trees.push({x:(x+.5)*T,y:(y+.5)*T,s:.8+R()*.3});solid[i]=1}
  // 차량: 승용차·버스
  const COLS=['#5a6470','#7a4b45','#6d6f5a','#8c8c88','#3f4752','#a8a49a','#4d5d4a','#c9c4b8','#d18a2c'];
  const vehFree=(x,y,w,h)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++){const k=j*MW+i;if(!isRoadT(tile[k])||solid[k]||inRoad(i,j,'v')&&inRoad(i,j,'h'))return false}return true};
  const placeVeh=(x,y,w,h,bus)=>{
    if(!vehFree(x,y,w,h))return false;
    const c={x,y,w,h,horiz:w>h,col:bus?['#3d6fd6','#3aa346','#d63a3a'][R()*3|0]:COLS[R()*COLS.length|0],alarm:!bus&&R()<.28,fired:false,bus};
    cars.push(c);setSolid(x,y,w,h,0);
    conts.push({x:(x+w/2)*T,y:(y+h/2)*T,type:bus?'bus':'trunk',car:c,loot:null,empty:false,reach:bus?60:46});return true};
  let tries=0;
  while(cars.length<70&&tries++<3000){
    const r=ROADS[R()*ROADS.length|0];
    if(r.d==='v'){const lx=R()*r.w|0;if(r.k==='major'&&(lx===3||lx===4))continue;placeVeh(r.x+lx,r.y+(R()*(r.h-2)|0),1,2)}
    else placeVeh(r.x+(R()*(r.w-2)|0),r.y+(R()*r.h|0),2,1);
  }
  for(let k=0,n=0;k<200&&n<6;k++){if(placeVeh(39+(R()*2|0),2+(R()*(MH-6)|0),1,3,true))n++}
  // 쓰레기통
  for(let k=0,n=0;k<800&&n<55;k++){const x=1+(R()*(MW-2)|0),y=1+(R()*(MH-2)|0),i=y*MW+x;if(tile[i]!==1&&tile[i]!==3)continue;if(solid[i]||resv[i]||road[i]===2&&R()<.5)continue;if(conts.some(c=>hyp(c.x-(x+.5)*T,c.y-(y+.5)*T)<T*2))continue;addCont(x,y,'bin');n++}
  for(let k=0;k<90;k++){const x=R()*MW*T,y=R()*MH*T;const tx=x/T|0,ty=y/T|0;if(!solid[ty*MW+tx])decals.push({x,y,r:6+R()*14,a:R()*6})}
  {const DR=mulberry32((seed^0x5eed)>>>0);for(let k=0,n=0;k<600&&n<45;k++){const x=1+(DR()*(MW-2)|0),y=1+(DR()*(MH-2)|0),i=y*MW+x;if((tile[i]!==1&&tile[i]!==3)||solid[i]||resv[i]||solid[i+MW]&&tile[i+MW]!==1)continue;decals.push({x:(x+.5)*T,y:(y+.7)*T,k:['bags','bags','scooter','bike'][DR()*4|0]});n++}}
  // 거점: 먹자골목 안쪽, 골목을 향한 원룸·오피스텔
  let home=null,bd=1e9;
  for(const b of buildings){if(b.kind==='tower'||b.kind==='cinema'||b.front!=='alley'||road[b.door.y*MW+b.door.x]!==2)continue;const d=hyp(b.door.x-55,b.door.y-52);if(d<bd){bd=d;home=b}}
  home.home=true;home.name='청운 오피스텔';home.kind='villa';home.col='#e6b94c';home.loot='none';home.H=Math.max(home.H,90);home.floors=0;
  HOME_TILE={x:home.door.x,y:home.door.y};
  const seen=new Set();
  conts=conts.filter(c=>{if(c.car)return true;const k=(c.y/T|0)*MW+(c.x/T|0);if(solid[k]||seen.has(k)||c.type==='none')return false;seen.add(k);return hyp(c.x-(HOME_TILE.x+.5)*T,c.y-(HOME_TILE.y+.5)*T)>3*T});
}
function addBuilding(x,y,w,h,front,pickChain,pickAlley,pickOffice){
  const b={x,y,w,h,front,door:{x:x+(w>>1),y:y+h}};
  let s;
  if(front==='major'&&w>=6&&R()<.55){b.kind='tower';b.name=pickOffice();b.loot='office';b.col='#2f4858';b.H=170+R()*110|0}
  else if(front==='major'||front==='minor'&&R()<.5){s=pickChain();b.kind='shop';b.name=s[0];b.loot=s[1];b.col=s[2];b.H=70+R()*50|0}
  else{s=pickAlley();b.kind=s[1]==='villa'?'villa':'alley';b.name=s[0];b.loot=s[1];b.col=s[2];b.H=(b.kind==='villa'?70:44)+R()*26|0}
  b.face=['#8e8a80','#a29d92','#7d8189','#958a7c','#857a6e','#9a9488'][R()*6|0];
  b.floors=floorsOf(b);
  buildings.push(b);setSolid(x,y,w,h,1);
  if(b.loot!=='none'){addCont(b.door.x-1,b.door.y,b.loot,{label:b.name});if(w>=6)addCont(b.door.x+1,b.door.y,b.loot,{label:b.name})}
}

/* ───────── 건물 안 (층별 탐색) ─────────
   거리 지도를 STREET에 맡겨 두고, 같은 배열(tile·solid·sightB) 위에 한 층짜리 실내를 그린다.
   층 모양은 건물 좌표+층으로 정해져 늘 같고, 뒤진 상자·남은 좀비는 G.floors에 층별로 남는다. */
let STREET=null;
const IN_OX=10,IN_OY=10,IN_H=11;
// tile: 5 바닥 6 벽 7 바깥(어둠) 8 위층 계단 9 아래층 계단 10 출구
const IN_STYLE={under:['#5b5852','#57544e','#5f5c56'],villa:['#6e5a44','#695540','#735f49'],office:['#565d64','#525960','#5b6269'],shop:['#8a877e','#85827a','#8f8c83'],food:['#74624d','#6f5d49','#796752']};
const LOOK={mart:'shelf',hard:'shelf',elec:'shelf',book:'shelf',apparel:'shelf',cinema:'shelf',beauty:'shelf',cafe:'fridge',fast:'fridge',meat:'fridge',bar:'fridge',office:'desk',bank:'desk',villa:'cabinet',clinic:'cabinet',pharm:'cabinet'};
function floorsOf(b){
  if(b.home)return 0;
  if(b.kind==='tower')return clamp(Math.round(b.H/50),4,7);
  if(b.kind==='villa')return clamp(Math.round(b.H/28),3,5);
  if(b.kind==='cinema')return 3;
  return 2;
}
function floorLoot(b,f){
  if(f===1||b.kind==='tower'||b.kind==='villa'||b.kind==='cinema')return b.loot==='none'?'office':b.loot;
  return b.kind==='alley'?'villa':'office';
}
function floorStyle(b,f){
  const l=floorLoot(b,f);
  if(l==='villa')return 'villa';if(l==='office'||l==='bank')return 'office';
  if(['cafe','fast','meat','bar'].includes(l))return 'food';return 'shop';
}
function doorBuilding(){
  if(G.area)return null;
  for(const b of buildings){if(!b.floors)continue;if(hyp(P.x-(b.door.x+.5)*T,P.y-(b.door.y+.5)*T)<26)return b}
  return null;
}
function inTile(){if(!G.area)return null;const tx=P.x/T|0,ty=P.y/T|0;for(const [i,j] of [[0,0],[1,0],[-1,0],[0,1],[0,-1]]){const t=tile[(ty+j)*MW+tx+i];if(t>=8&&t<=10&&hyp(P.x-(tx+i+.5)*T,P.y-(ty+j+.5)*T)<30)return t}return null}
function genFloor(b,f){
  const r=mulberry32(((b.x*73856093)^(b.y*19349663)^(f*83492791))>>>0);
  const iw=clamp(b.w*2+5,11,19),oy=IN_OY,ox=IN_OX,cy=oy+5;
  tile.fill(7);solid.fill(1);sightB.fill(1);mk.fill(0);
  const set=(x,y,t)=>{const i=y*MW+x;tile[i]=t;const open=t!==6&&t!==7;solid[i]=open?0:1;sightB[i]=open?0:1};
  for(let y=oy;y<oy+IN_H;y++)for(let x=ox;x<ox+iw;x++)set(x,y,(x===ox||x===ox+iw-1||y===oy||y===oy+IN_H-1||y===cy-1||y===cy+1)?6:5);
  const rooms=[];
  for(const [y0,y1,wy] of [[oy+1,cy-2,cy-1],[cy+2,oy+IN_H-2,cy+1]]){
    let x=ox+1;
    while(x<ox+iw-1){
      let w=3+(r()*3|0);if(ox+iw-1-(x+w)<3)w=ox+iw-1-x;
      const rx1=x+w-1;
      if(rx1<ox+iw-2)for(let y=y0;y<=y1;y++)set(rx1+1,y,6);
      const room={x0:x,x1:Math.min(rx1,ox+iw-2),y0,y1};rooms.push(room);
      set(x+(r()*Math.max(1,room.x1-x)|0),wy,5);
      x=rx1+2;
    }
  }
  const floors=b.floors;
  if(f<floors)set(ox+iw-2,cy,8);
  set(ox+1,cy,f===1?10:9);
  return {rooms,r,iw,entry:{x:ox+1,y:cy},up:{x:ox+iw-2,y:cy}};
}
function fillFloor(b,f,L){
  const key=`${b.x},${b.y},${f}`,st=G.floors[key]||(G.floors[key]={conts:null,Z:null});
  if(!st.conts){
    st.conts=[];const lt=floorLoot(b,f),look=LOOK[lt]||'shelf';
    for(const rm of L.rooms){
      const n=(L.r()<.75?1:0)+(L.r()<.3?1:0);
      for(let k=0;k<n;k++){const x=rm.x0+(L.r()*(rm.x1-rm.x0+1)|0),y=rm.y0+(L.r()*(rm.y1-rm.y0+1)|0);
        if(st.conts.some(c=>c.tx===x&&c.ty===y))continue;
        st.conts.push({x:(x+.5)*T,y:(y+.5)*T,tx:x,ty:y,type:lt,look,label:`${b.name} ${f}층`,loot:null,empty:false});}
    }
    const sv=G.floorSave&&G.floorSave[key];if(sv)st.conts.forEach((c,i)=>{if(sv[i]){c.empty=!!sv[i][0];c.loot=sv[i][1]}});
  }
  if(!st.Z){
    const keep=Z;Z=[];
    const n=Math.min(6,(L.r()*3|0)+Math.floor(G.day*.5)+(f>1?1:0));
    for(let k=0;k<n;k++){const rm=L.rooms[L.r()*L.rooms.length|0];const x=rm.x0+(L.r()*(rm.x1-rm.x0+1)|0),y=rm.y0+(L.r()*(rm.y1-rm.y0+1)|0);
      if(Math.abs(x-L.entry.x)<3&&Math.abs(y-L.entry.y)<2)continue;spawnZ((x+.5)*T,(y+.5)*T)}
    st.Z=Z;Z=keep;
  }
  return st;
}
function saveFloor(){if(G.area){const st=G.floors[`${G.area.b.x},${G.area.b.y},${G.area.f}`];st.conts=conts;st.Z=Z}}
function enterFloor(b,f,fromAbove){
  trapsLeave();
  if(!G.area)STREET={tile:tile.slice(),solid:solid.slice(),sightB:sightB.slice(),mk:mk.slice(),buildings,cars,trees,conts,decals,exits,Z};
  else saveFloor();
  const L=genFloor(b,f),st=fillFloor(b,f,L);
  buildings=[];cars=[];trees=[];exits=[];decals=[];conts=st.conts;Z=st.Z;noises=[];thrown=[];alarms=[];
  G.area={b,f,style:floorStyle(b,f)};P.search=null;
  const at=fromAbove?L.up:L.entry;P.x=(at.x+1.5)*T;P.y=(at.y+.5)*T;P.fx=1;P.fy=0;
  if(fromAbove){P.x=(at.x-.5)*T;P.fx=-1}
  for(const z of Z)z.state='idle';
  placeNpcs(L);if(ALLY){ALLY.x=P.x;ALLY.y=P.y}
  flowD=null;flowT=0;
  toast(`${b.name} ${f}층${f===b.floors?' · 꼭대기':''}`,'gold');
}
function exitToStreet(){
  trapsLeave();
  saveFloor();const b=G.area.b;
  tile.set(STREET.tile);solid.set(STREET.solid);sightB.set(STREET.sightB);mk.set(STREET.mk);
  ({buildings,cars,trees,conts,decals,exits,Z}=STREET);STREET=null;noises=[];thrown=[];alarms=[];
  G.area=null;P.search=null;P.x=(b.door.x+.5)*T;P.y=(b.door.y+.8)*T;P.fx=0;P.fy=1;flowD=null;flowT=0;NPCS=[];if(ALLY){ALLY.x=P.x;ALLY.y=P.y+20}
  toast('거리로 나왔다','', 'floor');
}
function useStairs(t){
  const {b,f}=G.area;
  if(t===8)enterFloor(b,f+1,false);
  else if(t===9)enterFloor(b,f-1,true);
  else exitToStreet();
}
function drawInTile(x,y,t,h){
  const X=x*T,Y=y*T;
  if(t===7){ctx.fillStyle='#050506';ctx.fillRect(X,Y,T+.5,T+.5);return}
  if(t===6){
    ctx.fillStyle='#2b2723';ctx.fillRect(X,Y,T+.5,T+.5);ctx.fillStyle='#4a443d';ctx.fillRect(X,Y,T+.5,8);
    const below=tile[(y+1)*MW+x];if(below===5||below>=8){ctx.fillStyle='#6b6257';ctx.fillRect(X,Y+T-14,T+.5,14);ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(X,Y+T-2,T+.5,2)}
    return;
  }

function hitsSolid(x,y,r){
  const x0=(x-r)/T|0,x1=(x+r)/T|0,y0=(y-r)/T|0,y1=(y+r)/T|0;
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    if(tx<0||ty<0||tx>=MW||ty>=MH)return true;
    if(solid[ty*MW+tx]){const nx=clamp(x,tx*T,tx*T+T),ny=clamp(y,ty*T,ty*T+T);if((x-nx)**2+(y-ny)**2<r*r)return true}
  }
  return false;
}
function move(e,dx,dy){let ok=0;if(dx&&!hitsSolid(e.x+dx,e.y,e.r)){e.x+=dx;ok++}if(dy&&!hitsSolid(e.x,e.y+dy,e.r)){e.y+=dy;ok++}return ok}
function los(x0,y0,x1,y1){
  const d=hyp(x1-x0,y1-y0),n=Math.ceil(d/10);
  for(let i=1;i<n;i++){const x=lerp(x0,x1,i/n),y=lerp(y0,y1,i/n);if(sightB[(y/T|0)*MW+(x/T|0)])return false}
  return true;
}
const QB=new Int32Array(MW*MH);
function bfs(px,py){
  const D=new Int16Array(MW*MH).fill(-1);
  const sx=clamp(px/T|0,0,MW-1),sy=clamp(py/T|0,0,MH-1);
  let h=0,t=0;D[sy*MW+sx]=0;QB[t++]=sy*MW+sx;
  while(h<t){const c=QB[h++],cx=c%MW,cy=c/MW|0,d=D[c]+1;
    if(cx>0&&!solid[c-1]&&D[c-1]<0){D[c-1]=d;QB[t++]=c-1}
    if(cx<MW-1&&!solid[c+1]&&D[c+1]<0){D[c+1]=d;QB[t++]=c+1}
    if(cy>0&&!solid[c-MW]&&D[c-MW]<0){D[c-MW]=d;QB[t++]=c-MW}
    if(cy<MH-1&&!solid[c+MW]&&D[c+MW]<0){D[c+MW]=d;QB[t++]=c+MW}}
  return D;
}
function fieldDir(z,D,gx,gy){
  const cx=z.x/T|0,cy=z.y/T|0;let best=D[cy*MW+cx],bx=cx,by=cy;
  if(best<0)return null;
  if(best<=1)return [gx-z.x,gy-z.y];
  for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){
    if(!i&&!j)continue;const nx=cx+i,ny=cy+j;
    if(!walk(nx,ny))continue;if(i&&j&&(!walk(cx+i,cy)||!walk(cx,cy+j)))continue;
    const v=D[ny*MW+nx];if(v>=0&&v<best){best=v;bx=nx;by=ny}
  }
  return [(bx+.5)*T-z.x,(by+.5)*T-z.y];
}

// 누르기: 짧게 누르면 그곳으로, 같은 곳을 빨리 두 번 누르면 달려서, 누른 채 끌면 손가락·마우스를 따라감
function tapGo(x,y){const n=performance.now(),dbl=n-TAPD.lt<340&&hyp(x-TAPD.lx,y-TAPD.ly)<48;TAPD.lt=dbl?0:n;TAPD.lx=x;TAPD.ly=y;
  if(dbl&&GO&&GO.kind!=='z'){GO.run=true;fx.push({k:'txt',x:P.x,y:P.y-40,vx:0,vy:-40,t:0,life:.6,txt:'달리기!',col:'#9fe0ff'});return}
  goTo(x,y,dbl)}
document.getElementById('cv').addEventListener('pointerdown',e=>{
  if(!G||G.state!=='field')return;
  if(e.button===2){const w=toWorld(e.clientX,e.clientY);const dx=w.x-P.x,dy=w.y-P.y+14,l=hyp(dx,dy)||1;P.fx=dx/l;P.fy=dy/l;throwFire();return}
  if(e.button!==0&&e.pointerType==='mouse')return;
  TAPD.id=e.pointerId;TAPD.x=e.clientX;TAPD.y=e.clientY;TAPD.t=performance.now();TAPD.drag=0;TAPD.hold=0;
  if(e.pointerType==='mouse')tapGo(e.clientX,e.clientY);
});
document.getElementById('cv').addEventListener('pointermove',e=>{
  if(e.pointerId!==TAPD.id||!G||G.state!=='field')return;
  if(!TAPD.drag&&hyp(e.clientX-TAPD.x,e.clientY-TAPD.y)<14)return;TAPD.drag=1;
  const n=performance.now();if(n-TAPD.hold<150||(GO&&GO.kind==='z'))return;TAPD.hold=n;const run=GO&&GO.run;goTo(e.clientX,e.clientY,run);
});
const tapEnd=e=>{if(e.pointerId!==TAPD.id)return;TAPD.id=null;
  if(e.type==='pointerup'&&e.pointerType!=='mouse'&&!TAPD.drag&&performance.now()-TAPD.t<500)tapGo(e.clientX,e.clientY)};
document.getElementById('cv').addEventListener('pointerup',tapEnd);document.getElementById('cv').addEventListener('pointercancel',tapEnd);
document.getElementById('cv').addEventListener('contextmenu',e=>e.preventDefault());
$('#pausebtn').addEventListener('click',()=>{if(G&&G.state==='field')pause()});
$('#mapbtn').addEventListener('click',()=>openMap());
$('#mini').addEventListener('click',()=>openMap());
$('#goal').addEventListener('click',()=>{GOALOPEN=!GOALOPEN;try{localStorage.setItem('seoul-survivor-goal',GOALOPEN?'1':'0')}catch(e){}if(G)goalHud()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G){saveGame();if(G.state==='field')pause()}});
if(matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');

/* ───────── 눌러서 가기(터치·클릭) ─────────
   땅을 누르면 그곳까지 길을 찾아 걷고, 좀비를 누르면 쫓아가 때리고, 상자·문·계단·사람·거점을 누르면 가서 쓴다.
   키보드·조이스틱을 움직이면 바로 취소. GO.D는 목표 칸에서 퍼진 BFS(fieldDir로 한 칸씩 내려감). */
let GO=null;
const goKey=()=>G.zone+'|'+(G.area?G.area.b.x+','+G.area.b.y+','+G.area.f:'');
function pickTarget(w){
  if(v3on()&&V3.tap){let z=null,zd=34;for(const q of Z){const p=v3proj(q.x,q.y,1);const d=hyp(p.x-V3.tap.sx,p.y-V3.tap.sy);if(d<zd){zd=d;z=q}}if(z)return {kind:'z',z,x:z.x,y:z.y};
    if(!G.area){let c=null,cd=26;for(const q of CR){if(q.fly)continue;const p=v3proj(q.x,q.y,.2);const d=hyp(p.x-V3.tap.sx,p.y-V3.tap.sy);if(d<cd){cd=d;c=q}}if(c)return {kind:'z',z:c,cr:1,x:c.x,y:c.y}}}
  let z=null,zd=30;for(const q of Z){const d=hyp(q.x-w.x,q.y-14-w.y);if(d<zd){zd=d;z=q}}
  if(z)return {kind:'z',z,x:z.x,y:z.y};
  if(!G.area){let c=null,cd=24;for(const q of CR){if(q.fly)continue;const d=hyp(q.x-w.x,q.y-4-w.y);if(d<cd){cd=d;c=q}}if(c)return {kind:'z',z:c,cr:1,x:c.x,y:c.y}}
  let b=null,bd=1e9;const A=(x,y,r,ok,lab)=>{const d=hyp(x-w.x,y-w.y);if(d<r&&d<bd){bd=d;b={kind:'act',x,y,ok,lab}}};
  for(const t of TRAPS)if(t.k==='rattrap'&&t.key===goKey())A(t.x,t.y,24,()=>nearTrap()===t,'쥐덫');
  for(const c of conts)A(c.x,c.y,26,()=>nearCont()===c,'뒤지기');
  if(G.area){for(const n of NPCS)A(n.x,n.y,30,()=>nearNpc()===n,'말 걸기');
    const tx=w.x/T|0,ty=w.y/T|0,t=tile[ty*MW+tx];if(t>=8&&t<=10)A((tx+.5)*T,(ty+.5)*T,40,()=>inTile()===t,t===10?'나가기':'계단')}
  else{if(G.zone==='gangnam')A((HOME_TILE.x+.5)*T,(HOME_TILE.y+.5)*T,40,nearHome,'거점');
    for(const l of links)A((l.x+.5)*T,(l.y+.5)*T,34,()=>nearLink()===l,'이동');
    for(const bb of buildings)if(bb.floors)A((bb.door.x+.5)*T,(bb.door.y+.5)*T,26,()=>doorBuilding()===bb,'들어가기')}
  return b||{kind:'go',x:w.x,y:w.y};
}
function goTo(sx,sy,run){
  if(!G||G.state!=='field')return false;
  V3.tap={sx,sy};const w=toWorld(sx,sy),t=pickTarget(w);
  if(P.search){P.search=null;toast('뒤지기를 멈췄다','','stop')}
  if(t.kind==='go'){const tx=t.x/T|0,ty=t.y/T|0;if(!walk(tx,ty)){let bd=1e9;for(let j=-3;j<=3;j++)for(let i=-3;i<=3;i++)if(walk(tx+i,ty+j)){const x=(tx+i+.5)*T,y=(ty+j+.5)*T,d=hyp(x-t.x,y-t.y);if(d<bd){bd=d;t.nx=x;t.ny=y}}if(bd<1e9){t.x=t.nx;t.y=t.ny}}}
  if(t.kind==='act'&&t.ok()){GO=null;interact();return true}
  t.D=bfs(t.x,t.y);const here=t.D[(P.y/T|0)*MW+(P.x/T|0)];
  if(here<0){toast('갈 수 없는 곳','','nogo');GO=null;return false}
  t.run=!!run;t.key=goKey();t.re=.3;t.st=0;t.lx=P.x;t.ly=P.y;t.born=performance.now();GO=t;return true;
}
function goStep(dt){
  const t=GO;if(t.key!==goKey()){GO=null;return null}
  if(t.kind==='z'){
    if(t.cr?(!CR.includes(t.z)||t.z.fly):(!Z.includes(t.z)||t.z.hp<=0)){GO=null;return null}
    const w=WEAP[P.weapon.id],dx=t.z.x-P.x,dy=t.z.y-P.y,d=hyp(dx,dy)||1;
    if(d<w.reach+t.z.r-(t.cr?10:4)){P.fx=dx/d;P.fy=dy/d;if(P.atkCd<=0)attack();return null}
    t.re-=dt;if(t.re<=0){t.re=.3;t.D=bfs(t.z.x,t.z.y);t.x=t.z.x;t.y=t.z.y}
  }else if(t.kind==='act'){if(t.ok()){GO=null;interact();return null}}
  else if(hyp(t.x-P.x,t.y-P.y)<10){GO=null;return null}
  // 막혀서 못 가면 멈춤
  t.st+=dt;if(t.st>.6){if(hyp(P.x-t.lx,P.y-t.ly)<6&&t.kind!=='z'){GO=null;return null}t.st=0;t.lx=P.x;t.ly=P.y}
  const v=fieldDir(P,t.D,t.x,t.y);if(!v){GO=null;return null}
  const l=hyp(v[0],v[1]);if(l<1){if(t.kind==='go')GO=null;return null}
  return [v[0]/l,v[1]/l];
}
function drawGo(){
  if(!GO)return;const t=GO,a=(performance.now()-t.born)/1000,p=(Math.sin(a*6)+1)/2;
  const x=t.kind==='z'?t.z.x:t.x,y=t.kind==='z'?t.z.y:t.y;
  ctx.save();ctx.lineWidth=2;ctx.strokeStyle=t.kind==='z'?'rgba(255,90,70,.9)':t.kind==='act'?'rgba(255,214,110,.9)':'rgba(140,220,255,.85)';
  const r=t.kind==='go'?Math.max(6,14-a*20)+p*3:16+p*3;ctx.beginPath();ctx.ellipse(x,y,r,r*.55,0,0,7);ctx.stroke();
  if(t.kind==='go'&&a<.3){ctx.globalAlpha=1-a/.3;ctx.beginPath();ctx.ellipse(x,y,6+a*90,(6+a*90)*.55,0,0,7);ctx.stroke()}
  ctx.restore();
}

/* ───────── 소굴: 들키면 좀비가 몰려나오는 곳 ─────────
   구역마다 2~3곳(좌표는 seed+구역으로 늘 같음). 반경 안에서 좀비에게 보이거나 뛰면 깨어나 무리가 쏟아져 나온다.
   깨어난 소굴은 그날 밤 잠잘 때까지 조용(G.nest[구역][i]=1). 소굴 무리는 물건을 잘 떨어뜨린다. */
const NEST_R=6*T,NEST_NAMES={subway:['막힌 승강장','무너진 환승 통로','멈춘 열차 칸'],bridge:['엉킨 버스 행렬','검문소 잔해','다리 밑 계단'],namsan:['케이블카 승강장','버려진 매표소','산책로 쉼터']};
let NEST={};
function nests(){
  if(G.area)return [];const key=G.seed+'|'+G.zone;if(NEST[key])return NEST[key];
  const r=mulberry32((G.seed^({gangnam:0x51a7,subway:0x2b1f,bridge:0x6c33,namsan:0x1d99}[G.zone]*7919))>>>0),out=[];
  const home=G.zone==='gangnam'?{x:(HOME_TILE.x+.5)*T,y:(HOME_TILE.y+.5)*T}:null;
  const far=(x,y)=>(!home||hyp(x-home.x,y-home.y)>18*T)&&links.every(l=>hyp(x-(l.x+.5)*T,y-(l.y+.5)*T)>9*T)&&out.every(o=>hyp(o.x-x,o.y-y)>22*T);
  const pts=(cx,cy,rad)=>{const a=[];for(let j=-rad;j<=rad;j++)for(let i=-rad;i<=rad;i++)if(walk(cx+i,cy+j))a.push([(cx+i+.5)*T,(cy+j+.5)*T]);return a};
  if(G.zone==='gangnam'){
    const bs=buildings.filter(b=>b.floors&&!b.home).sort(()=>r()-.5);
    for(const b of bs){if(out.length>=3)break;const x=(b.door.x+.5)*T,y=(b.door.y+.5)*T;if(!far(x,y))continue;const sp=pts(b.door.x,b.door.y,2);if(sp.length<3)continue;out.push({x,y,sp,name:b.name})}
  }else{
    for(let k=0;k<400&&out.length<2;k++){const tx=2+(r()*(MW-4)|0),ty=2+(r()*(MH-4)|0);if(!walk(tx,ty))continue;const x=(tx+.5)*T,y=(ty+.5)*T;if(!far(x,y))continue;const sp=pts(tx,ty,3);if(sp.length<12)continue;out.push({x,y,sp,name:NEST_NAMES[G.zone][out.length]})}
  }
  return NEST[key]=out;
}
const nestFired=i=>!!(G.nest&&G.nest[G.zone]&&G.nest[G.zone][i]);
// 소굴 둘레에 잠든 파수꾼 2~3마리(구역 좀비를 새로 뿌릴 때)
function nestGuards(){for(const [i,n] of nests().entries()){if(nestFired(i))continue;for(let k=0;k<2+(G.day>3);k++){const p=n.sp[R()*n.sp.length|0];spawnZ(p[0]+(R()-.5)*20,p[1]+(R()-.5)*20,'walker');const z=Z[Z.length-1];z.fx=R()-.5;z.fy=R()-.5;z.wt=99}}}
let nestT=0,HORDE=[];
function nestTick(dt){
  if(HORDE.length){for(const h of HORDE){h.t-=dt;while(h.t<=0&&h.n>0){h.t+=.22;h.n--;const p=h.sp[R()*h.sp.length|0],r=R(),type=r<.3+G.day*.02?'runner':r>.93?'screamer':'walker';spawnZ(p[0]+(R()-.5)*16,p[1]+(R()-.5)*16,type);const z=Z[Z.length-1];z.state='chase';z.lost=0;z.lx=P.x;z.ly=P.y;z.horde=1;fx.push({k:'spark',x:z.x,y:z.y-20,vx:(R()-.5)*60,vy:-50,t:0,life:.5,col:'#ff6a5a'})}}HORDE=HORDE.filter(h=>h.n>0)}
  nestT-=dt;if(nestT>0||G.area)return;nestT=.2;
  for(const [i,n] of nests().entries()){
    if(nestFired(i))continue;const d=hyp(P.x-n.x,P.y-n.y);if(d>NEST_R)continue;
    const seen=Z.some(z=>z.sees&&hyp(z.x-n.x,z.y-n.y)<NEST_R*1.4),loud=P.run;
    if(seen||loud)wakeNest(i,n,loud&&!seen?'뛰는 소리에':'들켰다!');
  }
}
function wakeNest(i,n,why){
  (G.nest=G.nest||{})[G.zone]=G.nest[G.zone]||[];G.nest[G.zone][i]=1;
  const cnt=Math.min(18,6+Math.round(G.day*1.5));HORDE.push({sp:n.sp,n:cnt,t:.5});
  noise(n.x,n.y,320,1,'255,80,60');shake=Math.max(shake,8);
  toast(`⚠ ${why} 「${n.name}」 소굴이 깨어났다! 좀비 ${cnt}마리가 몰려나온다 — 도망쳐!`,'red','nest');
  if(navigator.vibrate)try{navigator.vibrate([250,80,250,80,250])}catch(e){}
}
function drawNests(){
  const tt=performance.now()/1000;
  for(const [i,n] of nests().entries()){
    const f=nestFired(i),a=f?.18:.35+.15*Math.sin(tt*2.4+i);
    ctx.save();ctx.strokeStyle=`rgba(220,40,30,${a+.2})`;ctx.fillStyle=`rgba(200,20,10,${f?.04:a*.3})`;ctx.lineWidth=2;ctx.setLineDash(f?[4,8]:[10,6]);ctx.lineDashOffset=-tt*20;
    ctx.beginPath();ctx.ellipse(n.x,n.y,NEST_R,NEST_R*.6,0,0,7);ctx.fill();ctx.stroke();ctx.setLineDash([]);
    ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.8)';const t=f?`소굴 · ${n.name} (비었음)`:`⚠ 소굴 · ${n.name}`;
    ctx.strokeText(t,n.x,n.y-NEST_R*.6-6);ctx.fillStyle=f?'#a88':'#ff6a5a';ctx.fillText(t,n.x,n.y-NEST_R*.6-6);ctx.restore();
  }
}

/* ───────── 작은 짐승: 쥐·비둘기 ─────────
   쥐는 골목·지하에서 사람을 보면 잠깐 달아났다 멈춘다. 비둘기는 낮에 보도에서 모이를 쪼다가, 뛰어오거나 바짝 다가가면 날아간다(밤엔 숨음).
   때려잡으면 가방에 「쥐」「비둘기」(식칼로 손질 → 요리). 거리에만 있고 건물 안에는 없다. 저장하지 않고 구역을 뿌릴 때마다 새로 뿌린다. */
let CR=[];
function spawnCritters(){
  CR=[];const want={gangnam:{rat:7,pigeon:12},subway:{rat:16},bridge:{pigeon:8,rat:3},namsan:{pigeon:6,rat:4}}[G.zone]||{};
  for(const k in want){let n=0,g=0;while(n<want[k]&&g++<4000){const tx=1+(R()*(MW-2)|0),ty=1+(R()*(MH-2)|0);if(!walk(tx,ty))continue;const t=tile[ty*MW+tx];
    if(G.zone==='gangnam'&&(k==='rat'?t!==3:t!==1))continue;const x=(tx+.5)*T,y=(ty+.5)*T;if(hyp(x-P.x,y-P.y)<6*T)continue;
    const c={k,x,y,r:6,ph:R()*6,wt:R()*2,vx:0,vy:0,run:0,fly:0};CR.push(c);n++;
    if(k==='pigeon'&&R()<.6)for(let j=0;j<1+(R()*2|0);j++){const ox=x+(R()-.5)*36,oy=y+(R()-.5)*30;if(!hitsSolid(ox,oy,5)){CR.push({k,x:ox,y:oy,r:6,ph:R()*6,wt:R()*2,vx:0,vy:0,run:0,fly:0});n++}}}}
}
function critterTick(dt){
  if(G.area||!CR.length)return;const night=G.t>NIGHT;
  for(const c of CR){
    c.ph+=dt;const dx=c.x-P.x,dy=c.y-P.y,d=hyp(dx,dy)||1;
    if(c.k==='pigeon'){
      if(c.fly){c.fly+=dt;c.x+=c.vx*dt;c.y+=c.vy*dt;continue}
      if(night)continue;
      const moving=P.run||GO||keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD;
      if(d<(P.run?190:moving?44:30)){c.fly=.01;c.vx=dx/d*170;c.vy=dy/d*170-120;
        for(const o of CR)if(o!==c&&o.k==='pigeon'&&!o.fly&&hyp(o.x-c.x,o.y-c.y)<70){o.fly=.01;o.vx=(o.x-P.x)/(hyp(o.x-P.x,o.y-P.y)||1)*160;o.vy=-130}
        noise(c.x,c.y,60,0);continue}
      c.wt-=dt;if(c.wt<=0){c.wt=1+R()*2;const a=R()*7;c.vx=Math.cos(a)*14;c.vy=Math.sin(a)*14;if(R()<.5)c.vx=c.vy=0}
      move(c,c.vx*dt,c.vy*dt);
    }else{
      if(d<95&&c.run<=0&&!c.tired){c.run=1.3;c.vx=dx/d;c.vy=dy/d}
      if(c.run>0){c.run-=dt;if(c.run<=0){c.tired=2.5}const sp=125;if(!move(c,c.vx*sp*dt,c.vy*sp*dt)){const a=Math.atan2(c.vy,c.vx)+(R()<.5?1.4:-1.4);c.vx=Math.cos(a);c.vy=Math.sin(a)}}
      else{if(c.tired)c.tired=Math.max(0,c.tired-dt)||0;c.wt-=dt;if(c.wt<=0){c.wt=.6+R()*1.6;const a=R()*7;c.vx=Math.cos(a);c.vy=Math.sin(a);if(R()<.4)c.vx=c.vy=0}move(c,c.vx*28*dt,c.vy*28*dt)}
    }
  }
  CR=CR.filter(c=>!(c.fly>1.6));
}
function hitCritters(fa,reach){
  let got=0;
  for(const c of CR){if(c.fly||(c.k==='pigeon'&&G.t>NIGHT))continue;const dx=c.x-P.x,dy=c.y-P.y,d=hyp(dx,dy);if(d>reach+8)continue;
    if(Math.abs(angdiff(fa,Math.atan2(dy,dx)))>1.2&&d>22)continue;
    c.dead=1;got++;for(let i=0;i<4;i++)fx.push({k:'blood',x:c.x,y:c.y-4,vx:(R()-.5)*70,vy:(R()-.5)*70,t:0,life:.4});
    if(canCarry(c.k)){addTo(P.bag,c.k);fx.push({k:'txt',x:c.x,y:c.y-26,vx:0,vy:-30,t:0,life:1,txt:'+'+ITEMS[c.k].n,col:'#c6efb8'});seenMark()}else toast('가방이 꽉 찼다','red','full')}
  if(got)CR=CR.filter(c=>!c.dead);return got;
}
function drawCritters(){
  if(G.area)return;const night=G.t>NIGHT;
  for(const c of CR){
    if(c.k==='pigeon'){if(night&&!c.fly)continue;const up=c.fly?c.fly*60:0,b=c.fly?Math.sin(c.ph*30)*3:Math.max(0,Math.sin(c.ph*6))*2;
      if(!c.fly){ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(c.x,c.y+2,6,2.5,0,0,7);ctx.fill()}
      ctx.fillStyle='#8a8f9c';ctx.beginPath();ctx.ellipse(c.x,c.y-5-up,6,4,0,0,7);ctx.fill();
      ctx.fillStyle='#6c7280';ctx.beginPath();ctx.arc(c.x+(c.vx<0?-5:5),c.y-8-up+b,2.6,0,7);ctx.fill();
      ctx.fillStyle='#5fbf9a';ctx.fillRect(c.x+(c.vx<0?-6:3),c.y-7-up+b,3,1.5);
      if(c.fly){ctx.fillStyle='#9aa0ad';ctx.fillRect(c.x-9,c.y-7-up-b,6,2);ctx.fillRect(c.x+3,c.y-7-up-b,6,2)}
    }else{const s=c.vx<0?-1:1;
      ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(c.x,c.y+1,6,2,0,0,7);ctx.fill();
      ctx.fillStyle='#5a4a40';ctx.beginPath();ctx.ellipse(c.x,c.y-3,6,3.2,0,0,7);ctx.fill();ctx.beginPath();ctx.arc(c.x+5*s,c.y-4,2.4,0,7);ctx.fill();
      ctx.strokeStyle='#8a6e66';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(c.x-5*s,c.y-2);ctx.quadraticCurveTo(c.x-10*s,c.y-1+Math.sin(c.ph*8)*2,c.x-13*s,c.y-4);ctx.stroke();
      ctx.fillStyle='#ff6a6a';ctx.fillRect(c.x+6*s,c.y-5,1,1)}
  }
}

/* ───────── 설치물: 판자 막이·경보줄·깨진 병·쥐덫 ─────────
   가방에서 「놓기」. 판자 막이는 앞 칸을 25초 막고(좀비는 돌아간다), 경보줄은 좀비가 지나가면 딸랑(미니맵 표시),
   깨진 병은 밟은 좀비를 느리게 하고 소리를 낸다, 쥐덫은 1분쯤 뒤 쥐가 걸린다. 구역·층마다 따로(key), 저장하지 않는다. */
let TRAPS=[];
function placeTrap(id){
  const t={k:id,key:goKey(),x:P.x,y:P.y};
  if(id==='plankbar'){const tx=(P.x+P.fx*T)/T|0,ty=(P.y+P.fy*T)/T|0,i=ty*MW+tx;
    if(!walk(tx,ty)||Z.some(z=>hyp(z.x-(tx+.5)*T,z.y-(ty+.5)*T)<16)||hyp(P.x-(tx+.5)*T,P.y-(ty+.5)*T)<14){toast('앞에 판자를 세울 자리가 없다','red');return false}
    Object.assign(t,{x:(tx+.5)*T,y:(ty+.5)*T,i,life:25});solid[i]=1;flowD=null;}
  else if(id==='rattrap'){if(G.area){toast('쥐덫은 거리나 지하에 놓자','red');return false}t.wait=60}
  else if(id==='glass')t.life=240;
  take(P.bag,id);TRAPS.push(t);noise(P.x,P.y,30,0);toast(`${ITEMS[id].n}을(를) 놓았다`,'green');return true;
}
function trapsLeave(){for(const t of TRAPS)if(t.k==='plankbar'&&t.key===goKey())solid[t.i]=0;TRAPS=TRAPS.filter(t=>t.k!=='plankbar'||t.key!==goKey())}
const nearTrap=()=>TRAPS.find(t=>t.k==='rattrap'&&t.key===goKey()&&hyp(t.x-P.x,t.y-P.y)<30);
function trapTick(dt){
  const key=goKey();
  for(const t of TRAPS){if(t.key!==key)continue;
    if(t.k==='plankbar'){t.life-=dt;if(t.life<=0){solid[t.i]=0;flowD=null;t.gone=1}}
    else if(t.k==='tripwire'){if(t.ping){t.ping-=dt;if(t.ping<=0)t.gone=1;continue}
      if(Z.some(z=>hyp(z.x-t.x,z.y-t.y)<24)){t.ping=6;noise(t.x,t.y,150,1,'255,220,90');const dx=t.x-P.x,dy=t.y-P.y,m=Math.round(hyp(dx,dy)/T*1.6);toast(`🔔 경보줄이 울렸다 — ${Math.abs(dx)>Math.abs(dy)?(dx>0?'동':'서'):(dy>0?'남':'북')}쪽 ${m}m`,'red','trip')}}
    else if(t.k==='glass'){t.life-=dt;if(t.life<=0)t.gone=1;for(const z of Z)if(hyp(z.x-t.x,z.y-t.y)<30){z.slowT=.7;if(!(z.glassCd>0)){z.glassCd=1.2;noise(t.x,t.y,70,0)}}}
    else if(t.k==='rattrap'&&!t.catch){t.wait-=dt;if(t.wait<=0)t.catch=1+(R()<.4)}
  }
  for(const z of Z)if(z.glassCd>0)z.glassCd-=dt;
  TRAPS=TRAPS.filter(t=>!t.gone);
}
function checkTrap(t){
  if(!t.catch){toast(`쥐덫: 아직 걸린 게 없다 (${Math.ceil(t.wait)}초쯤)`);return}
  let got=0;while(t.catch>0&&canCarry('rat')){addTo(P.bag,'rat');t.catch--;got++}
  if(got){toast(`쥐덫에서 쥐 ${got}마리`,'green');seenMark()}else toast('가방이 꽉 찼다','red');
  if(!t.catch){t.catch=0;t.wait=60}
}
function drawTraps(){
  const key=goKey(),now=performance.now()/1000;
  for(const t of TRAPS){if(t.key!==key)continue;const x=t.x,y=t.y;
    if(t.k==='plankbar'){ctx.fillStyle='#7a5a36';for(let i=0;i<3;i++)ctx.fillRect(x-14,y-18+i*9,28,6);ctx.fillStyle='#4a3420';ctx.fillRect(x-12,y-20,3,26);ctx.fillRect(x+9,y-20,3,26);
      ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x-14,y+10,28*Math.max(0,t.life/25),3)}
    else if(t.k==='tripwire'){ctx.strokeStyle=t.ping?'#ffd35a':'rgba(220,210,180,.7)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x-16,y);ctx.lineTo(x+16,y);ctx.stroke();ctx.fillStyle='#b9bcc2';ctx.fillRect(x-18,y-4,5,6);ctx.fillRect(x+13,y-4,5,6);
      if(t.ping){ctx.strokeStyle=`rgba(255,211,90,${t.ping/6})`;ctx.beginPath();ctx.arc(x,y,20+(6-t.ping)*20,0,7);ctx.stroke()}}
    else if(t.k==='glass'){for(let i=0;i<7;i++){const a=i*2.4,r=6+i*3%14;ctx.fillStyle=(Math.sin(now*3+i)>.6)?'#e8f7ff':'#6f9a8a';ctx.fillRect(x+Math.cos(a)*r,y+Math.sin(a)*r*.6,2,2)}}
    else if(t.k==='rattrap'){ctx.fillStyle='#8a6a44';ctx.fillRect(x-7,y-5,14,8);ctx.fillStyle='#c9ccd2';ctx.fillRect(x-6,y-6,12,1);
      if(t.catch){ctx.fillStyle='#5a4a40';ctx.beginPath();ctx.ellipse(x,y-6,5,3,0,0,7);ctx.fill();ctx.fillStyle='#ffd35a';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText('!',x,y-12)}}
  }
}

/* ───────── 들개 ─────────
   ZT.dog: 강남 골목·한강 다리에 3~4마리 무리. 좀비보다 빠르지만 물려도 감염되지 않는다. 잡으면 「들개」(2×2) → 손질해 개고기 4. */
function spawnDogs(){
  const packs={gangnam:G.day>=4?2:G.day>=2?1:0,bridge:1}[G.zone]||0,home=G.zone==='gangnam'?{x:(HOME_TILE.x+.5)*T,y:(HOME_TILE.y+.5)*T}:null;
  for(let p=0;p<packs;p++){for(let g=0;g<800;g++){const tx=2+(R()*(MW-4)|0),ty=2+(R()*(MH-4)|0);if(!walk(tx,ty))continue;if(G.zone==='gangnam'&&tile[ty*MW+tx]!==3)continue;
    const x=(tx+.5)*T,y=(ty+.5)*T;if(hyp(x-P.x,y-P.y)<12*T||(home&&hyp(x-home.x,y-home.y)<14*T))continue;
    const n=3+(R()<.4);for(let k=0;k<n;k++){const ox=x+(R()-.5)*40,oy=y+(R()-.5)*40;spawnZ(hitsSolid(ox,oy,8)?x:ox,hitsSolid(ox,oy,8)?y:oy,'dog')}break}}
}
const nearWater=()=>{if(G.area)return false;const cx=P.x/T|0,cy=P.y/T|0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)if(tile[(cy+j)*MW+cx+i]===11)return true;return false};

/* ───────── 플레이어 행동 ───────── */
const bagCount=()=>Object.values(P.bag).reduce((a,b)=>a+b,0);
function addTo(s,id,n=1){s[id]=(s[id]||0)+n}
function take(s,id,n=1){s[id]-=n;if(s[id]<=0)delete s[id]}
function attack(){
  if(P.atkCd>0||P.search)return;
  const w=WEAP[P.weapon.id];P.atkCd=w.cd;P.swing=.2;
  const fa=Math.atan2(P.fy,P.fx);let hit=0;
  for(const z of Z){
    const dx=z.x-P.x,dy=z.y-P.y,d=hyp(dx,dy);
    if(d>w.reach+z.r)continue;
    if(Math.abs(angdiff(fa,Math.atan2(dy,dx)))>1.1&&d>z.r+P.r+4)continue;
    let dmg=w.dmg*(.85+R()*.3);const sneak=z.state!=='chase';if(sneak)dmg*=1.6;
    z.hp-=dmg;z.hitT=.15;hit++;
    const l=d||1;move(z,dx/l*16,dy/l*16);
    if(z.state!=='chase'){z.state='chase';z.lost=0;if(z.type==='screamer'&&z.hp>0)scream(z)}
    fx.push({k:'txt',x:z.x,y:z.y-30,vx:0,vy:-40,t:0,life:.7,txt:(sneak?'기습 ':'')+Math.round(dmg),col:sneak?'#ffe19a':'#fff'});
    for(let i=0;i<5;i++)fx.push({k:'blood',x:z.x,y:z.y-10,vx:dx/l*60+(R()-.5)*80,vy:dy/l*60+(R()-.5)*80,t:0,life:.45});
  }
  hit+=hitCritters(fa,w.reach);
  for(const z of Z)if(z.hp<=0)killZ(z);
  Z=Z.filter(z=>z.hp>0);
  if(hit&&P.weapon.id!=='fist'){P.weapon.dur--;if(P.weapon.dur<=0){toast(`${w.n}이(가) 부러졌다!`,'red');P.weapon={id:'fist',dur:Infinity}}}
  noise(P.x,P.y,hit?95:35,0);
  if(hit)shake=Math.max(shake,3);
}
function killZ(z){
  G.kills++;decals.push({x:z.x,y:z.y,r:12+R()*8,a:R()*6});
  if(z.type==='dog'){if(canCarry('dog')){addTo(P.bag,'dog');seenMark();fx.push({k:'txt',x:z.x,y:z.y-40,vx:0,vy:-30,t:0,life:1,txt:'+들개',col:'#c6efb8'})}else toast('가방이 꽉 차 들개를 못 챙겼다','red','full');return}
  if(z.horde&&R()<.4){const id=['parts','tape','anti','battery','fire','can','water','bandage'][R()*8|0];if(canCarry(id)){addTo(P.bag,id);fx.push({k:'txt',x:z.x,y:z.y-40,vx:0,vy:-30,t:0,life:1,txt:'+'+ITEMS[id].n,col:'#ffd27a'})}return}
  if(R()<.12){const id=['cloth','scrap','tape','parts'][R()*4|0];if(!canCarry(id))return;addTo(P.bag,id);fx.push({k:'txt',x:z.x,y:z.y-40,vx:0,vy:-30,t:0,life:1,txt:'+'+ITEMS[id].n,col:'#c6efb8'})}
}
function nearHome(){return G.zone==='gangnam'&&!G.area&&hyp(P.x-(HOME_TILE.x+.5)*T,P.y-(HOME_TILE.y+.5)*T)<48}
function nearCont(){let b=null,bd=1e9;for(const c of conts){const d=hyp(c.x-P.x,c.y-P.y);if(d<(c.reach||36)&&d<bd){b=c;bd=d}}return b}
function interact(){
  if(P.search)return;
  const tr=nearTrap();if(tr){checkTrap(tr);return}
  if(G.area){const n=nearNpc();if(n){talkTo(n);return}const t=inTile();if(t){useStairs(t);return}}
  else{if(nearHome()){openBase();return}const l=nearLink();if(l){travel(l);return}const db=doorBuilding();if(db){enterFloor(db,1,false);return}}
  const c=nearCont();
  if(!c&&nearWater()){if(!P.bag.rod){toast('낚싯대가 있으면 붕어를 낚을 수 있다');return}P.search={fish:1,t:0,dur:6};noise(P.x,P.y,25,0);return}
  if(!c)return;
  if(c.empty){if(c.car&&!c.car.bus&&!c.car.train&&!c.car.mil&&!c.car.doorless){P.search={door:c,t:0,dur:4};noise(P.x,P.y,140,1);toast('문짝을 뜯는다 — 시끄럽다!','','door');return}toast(`${LOOT[c.type].n}: 이미 뒤졌다`,'','empty');return}
  P.search={c,t:0};noise(P.x,P.y,70,1);
}
function finishSearch(){
  const sr=P.search;P.search=null;
  if(sr.fish){if(R()<.65){if(canCarry('fish')){addTo(P.bag,'fish');seenMark();toast('붕어를 낚았다!','green')}else toast('가방이 꽉 찼다','red')}else toast('입질이 없다… 다시 던져 보자');return}
  if(sr.door){if(canCarry('cardoor')){addTo(P.bag,'cardoor');sr.door.car.doorless=1;seenMark();toast('차 문짝을 뜯었다 (바리케이드 재료)','green')}else toast('문짝(2×3칸)이 가방에 안 들어간다','red');noise(P.x,P.y,140,1);return}
  const c=sr.c;
  if(!c.loot)c.loot=rollLoot(c.type);
  if(c.car&&c.car.alarm&&!c.car.fired){c.car.fired=true;alarm(c.car)}
  if(!c.loot.length){c.empty=true;toast(`${LOOT[c.type].n}: 쓸 만한 게 없다`);return}
  openLoot(c);
}
function rollLoot(k){const o=[];for(const [i,p] of LOOT[k].t)if(R()<p)o.push(i);return o}
const THROWS=['fire','molotov','bomb'];
const throwKind=()=>P.throwSel&&P.bag[P.throwSel]?P.throwSel:THROWS.find(k=>P.bag[k])||P.throwSel||'fire';
function throwFire(){
  const kind=throwKind();
  if(!P.bag[kind]){toast(`${ITEMS[kind].n}이(가) 없다`,'','nofire');return}
  take(P.bag,kind);
  thrown.push({x:P.x,y:P.y-8,vx:P.fx*330,vy:P.fy*330,t:0,st:'fly',life:5,k:0,r:4,kind});
}
// 불·폭발로 좀비를 다치게 하고 쓰러지면 처리
function areaHurt(x,y,R,dmg,push){
  for(const z of Z){const dx=z.x-x,dy=z.y-y,d=hyp(dx,dy);if(d>R)continue;const k=1-d/R*.6;z.hp-=dmg*k;z.hitT=.15;
    if(z.state!=='chase'){z.state='chase';z.lost=0;z.lx=P.x;z.ly=P.y}if(push&&d>0)move(z,dx/d*push*k,dy/d*push*k)}
  for(const z of Z)if(z.hp<=0)killZ(z);Z=Z.filter(z=>z.hp>0);
}
const QUICK=[['food','🍚','먹기'],['water','💧','마시기'],['bandage','🩹','붕대'],['anti','💊','항생제'],['fire','🧨','폭죽']];
// 먹을 것 고르기: 곧 상할 요리 먼저 → 일반 음식 → (그것도 없으면) 요리 재료인 김치·스팸. 날것·상한 것은 고르지 않는다
function bestFood(s){let b=null,bs=-1e9;for(const id in s){const it=ITEMS[id];if(!s[id]||!it||!it.food||it.raw||id==='rotten')continue;const sc=(it.rot?100-it.rot*10:0)+it.food-(id==='kimchi'||id==='spam'?200:0);if(sc>bs){bs=sc;b=id}}return b}
function quickUse(i){
  const k=QUICK[i][0];
  if(k==='fire'){throwFire();return}
  const id=k==='food'?bestFood(P.bag):k;
  if(!id||!P.bag[id]){toast('가방에 없다','','noitem');return}
  useItem(id,P.bag);
}
function useItem(id,s){
  const it=ITEMS[id];if(!s[id])return;
  if(it.food)P.food=clamp(P.food+it.food,0,100);
  if(it.water)P.water=clamp(P.water+it.water,0,100);
  if(it.hp)P.hp=clamp(P.hp+it.hp,0,100);
  if(it.inf)P.inf=clamp(P.inf+it.inf,0,100);
  take(s,id);if(id==='soju')addTo(s,'bottle');toast(`${it.n} 사용`,'green');
}
function hurtPlayer(z){
  const t=ZT[z.type];P.hp-=t.dmg*(1+(G.day-1)*.05)*(1-gearDef());P.hurt=.35;shake=7;
  if(z.type!=='dog'&&R()<.33*(1-gearBite())){const a=9+(R()*7|0);P.inf=clamp(P.inf+a,0,100);toast(`물렸다! 감염 +${a}`,'red')}
  for(let i=0;i<6;i++)fx.push({k:'blood',x:P.x,y:P.y-12,vx:(R()-.5)*120,vy:(R()-.5)*120,t:0,life:.5});
  if(P.search)P.search=null;
}

/* ───────── 갱신 ───────── */
function update(dt){
  G.t+=dt;
  const night=G.t>NIGHT;
  // 입력
  let mx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),my=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  if(joy.on){mx=joy.x;my=joy.y}
  let mag=Math.min(1,hyp(mx,my));
  if(mag<.15)mag=0;
  if(mag>0)GO=null;else if(GO){const v=goStep(dt);if(v){mx=v[0];my=v[1];mag=1}}
  const run=(keys.ShiftLeft||keys.ShiftRight||runToggle||(GO&&GO.run))&&mag>0;P.run=run;
  if(P.search){if(mag>0){P.search=null;toast('뒤지기를 멈췄다','','stop')}else{P.search.t+=dt;if(P.search.t>=(P.search.dur||searchTime()))finishSearch()}}
  if(mag>0){
    const l=hyp(mx,my);const ux=mx/l,uy=my/l;P.fx=ux;P.fy=uy;
    const weak=P.food<=0||P.water<=0;
    const load=bagWeight()/capKg(),spd=(run?150:95)*(weak?.75:1)*(0.5+.5*mag)*(1-.25*clamp((load-.6)/.4,0,1));
    move(P,ux*spd*dt,uy*spd*dt);P.ph+=dt*spd*.12;
    P.stepT-=dt;if(P.stepT<=0){P.stepT=run?.35:.6;noise(P.x,P.y,run?150:42,run?1:0,'255,255,255')}
  }
  P.food=Math.max(0,P.food-.06*dt);P.water=Math.max(0,P.water-(run?.16:.09)*(raining()?.5:1)*dt);
  if(P.food<=0||P.water<=0)P.hp-=.6*dt;
  P.atkCd-=dt;P.hurt-=dt;P.swing-=dt;
  // 길찾기
  flowT-=dt;if(flowT<=0||!flowD){flowD=bfs(P.x,P.y);flowT=.35}
  // 좀비
  for(const z of Z)updateZ(z,dt,night);
  {let dead=0;for(const z of Z)if(z.burnT>0){z.burnT-=dt;z.hp-=9*dt;if(R()<.4)fx.push({k:'spark',x:z.x+(R()-.5)*10,y:z.y-14-R()*10,vx:(R()-.5)*20,vy:-50,t:0,life:.35,col:R()<.5?'#ff8a3a':'#ffd76a'});if(z.hp<=0){killZ(z);dead=1}}if(dead)Z=Z.filter(z=>z.hp>0)}
  allyUpdate(dt);finalTick(dt);nestTick(dt);critterTick(dt);trapTick(dt);
  lightTick(dt,G.t>NIGHT-15||!!G.area||!!ZONES[G.zone].dark);
  for(let i=0;i<Z.length;i++)for(let j=i+1;j<Z.length;j++){
    const a=Z[i],b=Z[j],dx=b.x-a.x,dy=b.y-a.y,d=hyp(dx,dy);
    if(d>0&&d<22){const p=(22-d)/2,ux=dx/d,uy=dy/d;move(a,-ux*p,-uy*p);move(b,ux*p,uy*p)}
  }
  for(const z of Z){const dx=z.x-P.x,dy=z.y-P.y,d=hyp(dx,dy);if(d>0&&d<20){move(z,dx/d*(20-d),dy/d*(20-d))}}
  // 소리 표시
  for(const n of noises)n.t+=dt;noises=noises.filter(n=>n.t<.8);
  // 폭죽
  for(const f of thrown){
    f.t+=dt;
    if(f.st==='fly'){
      const k=Math.pow(.05,dt);f.vx*=k;f.vy*=k;
      if(!move(f,f.vx*dt,f.vy*dt)){f.vx*=-.3;f.vy*=-.3}
      if(f.kind==='molotov'&&f.t>.5){f.st='burn';f.t=0;f.life=4.5;f.k=0;noise(f.x,f.y,260,1,'255,140,60');shake=Math.max(shake,4);toast('화염병이 깨지며 불길이 번진다','gold','molo');continue}
      if(f.kind==='bomb'&&f.t>.6){f.st='fuse';f.t=0;f.life=1.5;continue}
      if(f.t>.6){f.st='burn';f.t=0;toast('폭죽이 터진다 — 좀비가 그쪽으로 몰린다','gold','fire')}
    }else if(f.kind==='bomb'){
      f.life-=dt;if(R()<.5)fx.push({k:'spark',x:f.x,y:f.y-8,vx:(R()-.5)*40,vy:-R()*60,t:0,life:.3,col:'#ffd76a'});
      if(f.life<=0){const BR=100;areaHurt(f.x,f.y,BR,70,26);const pd=hyp(P.x-f.x,P.y-f.y);if(pd<BR){P.hp-=25*(1-pd/BR);P.hurt=.4;toast('폭발에 휘말렸다!','red')}
        noise(f.x,f.y,460,1,'255,120,60');shake=Math.max(shake,12);for(const c of CR)if(hyp(c.x-f.x,c.y-f.y)<BR)c.dead=1;CR=CR.filter(c=>!c.dead);
        for(let i=0;i<40;i++){const a=R()*7,v=60+R()*240;fx.push({k:'spark',x:f.x,y:f.y-8,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,t:0,life:.5+R()*.4,col:R()<.5?'#ffd76a':R()<.5?'#ff7a3a':'#9a9a9a'})}
        fx.push({k:'boom',x:f.x,y:f.y,vx:0,vy:0,t:0,life:.45});decals.push({x:f.x,y:f.y,r:30,a:0});f.gone=1}
    }else if(f.kind==='molotov'){
      f.life-=dt;f.k-=dt;if(f.k<=0){f.k=.25;for(const z of Z)if(hyp(z.x-f.x,z.y-f.y)<58)z.burnT=2.5;areaHurt(f.x,f.y,58,6,0);if(hyp(P.x-f.x,P.y-f.y)<50){P.hp-=3;P.hurt=.2}if(f.life%1<.25)noise(f.x,f.y,150,0)}
      for(let i=0;i<3;i++){const a=R()*7,r=R()*50;fx.push({k:'spark',x:f.x+Math.cos(a)*r,y:f.y+Math.sin(a)*r*.6,vx:(R()-.5)*20,vy:-40-R()*60,t:0,life:.45,col:R()<.6?'#ff8a3a':'#ffd76a'})}
    }else{
      f.life-=dt;f.k-=dt;
      if(f.k<=0){f.k=.7;noise(f.x,f.y,400,1,'255,200,90')}
      for(let i=0;i<2;i++)fx.push({k:'spark',x:f.x,y:f.y-4,vx:(R()-.5)*140,vy:-R()*140,t:0,life:.4,col:R()<.5?'#ffd76a':'#ff7a4a'});
    }
  }
  thrown=thrown.filter(f=>!f.gone&&(f.st==='fly'||f.life>0));
  for(const a of alarms){a.t-=dt;a.k-=dt;if(a.k<=0){a.k=1;noise(a.x,a.y,540,1,'255,90,80')}}
  alarms=alarms.filter(a=>a.t>0);
  for(const f of fx){f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.k==='blood'){f.vx*=.9;f.vy*=.9}}
  fx=fx.filter(f=>f.t<f.life);
  // 밤 증원
  if(night&&!G.area){G.spT-=dt;if(G.spT<=0){G.spT=4.5;if(Z.length<44+G.day*9)spawnNear()}}
  if(G.t>NIGHT&&!G.warned){G.warned=1;toast('해가 졌다. 어둠 속에서 좀비가 늘어난다','red')}
  if(G.t>NIGHT-30&&!G.warn0){G.warn0=1;sms('urgent','강남구청','일몰이 임박했습니다. 야간에는 감염자 활동이 크게 늘어납니다. 즉시 실내로 대피하십시오.')}
  shake=Math.max(0,shake-dt*30);
  G.saveT=(G.saveT||15)-dt;if(G.saveT<=0)saveGame();
  if(P.hp<=0)gameOver('hp');else if(P.inf>=100)gameOver('inf');
}
function spawnNear(){
  for(let k=0;k<40;k++){
    const a=R()*Math.PI*2,d=420+R()*260,x=P.x+Math.cos(a)*d,y=P.y+Math.sin(a)*d;
    const tx=x/T|0,ty=y/T|0;
    if(!walk(tx,ty)||onScreen(x,y)||hyp(tx-HOME_TILE.x,ty-HOME_TILE.y)<6)continue;
    spawnZ(x,y);return;
  }
}
function updateZ(z,dt,night){
  const t=ZT[z.type];
  z.atkCd-=dt;z.hitT-=dt;z.senseT-=dt;z.scT-=dt;
  const dx=P.x-z.x,dy=P.y-z.y,d=hyp(dx,dy);
  if(z.senseT<=0){
    z.senseT=.2+R()*.1;
    const sight=t.sight*(night?.75:1)*(P.run?1.1:1)*(raining()?.85:1);
    let sees=false;
    if(d<sight){
      const da=Math.abs(angdiff(Math.atan2(z.fy,z.fx),Math.atan2(dy,dx)));
      const cone=z.state==='idle'?1.05:z.state==='inv'?1.6:Math.PI;
      if((da<cone||d<55)&&los(z.x,z.y-8,P.x,P.y-8))sees=true;
    }
    z.sees=sees;
    if(sees){
      if(z.state!=='chase'){z.state='chase';z.alert=1;if(z.type==='screamer'){scream(z);z.scT=7}}
      z.lost=0;z.lx=P.x;z.ly=P.y;
    }else if(z.state==='chase'){z.lost+=.25;if(z.lost>2.6){z.state='inv';z.goal={x:z.lx,y:z.ly,D:null}}}
  }
  if(z.type==='screamer'&&z.state==='chase'&&z.sees&&z.scT<=0){z.scT=7;scream(z)}
  let vx=0,vy=0,spd=t.spd*(night?1.15:1);
  if(z.state==='chase'){
    spd=t.chase*(night?1.15:1);
    if(z.sees&&d<240){vx=dx;vy=dy}else{const f=fieldDir(z,flowD,P.x,P.y);if(f){vx=f[0];vy=f[1]}else{vx=dx;vy=dy}}
    const ad=ALLY?hyp(ALLY.x-z.x,ALLY.y-z.y):1e9;
    if(ad<z.r+19&&ad<d&&z.atkCd<=0){z.atkCd=1.1;hurtAlly(z);vx=vy=0}
    else if(d<z.r+P.r+9&&z.atkCd<=0){z.atkCd=1.1;hurtPlayer(z);vx=vy=0}
    else if(d<z.r+P.r+4){vx=vy=0}
  }else if(z.state==='inv'){
    const g=z.goal;
    if(!g.D)g.D=bfs(g.x,g.y);
    if(hyp(g.x-z.x,g.y-z.y)<26){z.look+=dt;if(z.look>2){z.state='idle';z.wt=0}}
    else{const f=fieldDir(z,g.D,g.x,g.y);if(f){vx=f[0];vy=f[1]}else{z.state='idle'}}
    spd*=1.25;
  }else{
    z.wt-=dt;
    if(z.wt<=0){if(R()<.45){z.wx=z.wy=0}else{const a=R()*Math.PI*2;z.wx=Math.cos(a);z.wy=Math.sin(a)}z.wt=1+R()*2.5}
    vx=z.wx;vy=z.wy;spd*=.6;
  }
  if(z.slowT>0){z.slowT-=dt;spd*=.45}
  const l=hyp(vx,vy);
  if(l>.01){
    let mx=vx/l*spd*dt,my=vy/l*spd*dt;
    if(!move(z,mx,my)){let ok=0;for(const a of [.8,-.8,1.6,-1.6]){const c=Math.cos(a),s=Math.sin(a);if(move(z,mx*c-my*s,mx*s+my*c)){ok=1;break}}if(!ok&&z.state==='idle')z.wt=0}
    z.fx=lerp(z.fx,vx/l,.2);z.fy=lerp(z.fy,vy/l,.2);z.ph+=dt*spd*.12;
  }
}

function has(need){return Object.entries(need).every(([k,v])=>(G.stash[k]||0)>=v)}
function needText(need){return Object.entries(need).map(([k,v])=>`<span class="${(G.stash[k]||0)<v?'no':''}">${ITEMS[k].ic}${ITEMS[k].n} ${G.stash[k]||0}/${v}</span>`).join(' ')}
function facNeed(id){const f=FACS[id],lv=G.fac[id]||0,o={};if(f.lv)return Object.assign({},(f.lv[lv]||f.lv[f.lv.length-1])[1]);for(const k in f.need)o[k]=f.need[k]*(lv+1);return o}
function bar(v,col){return `<div class="bar"><i style="width:${clamp(v,0,100)}%;background:${col}"></i></div>`}

/* 제작: 거점은 창고(+거점 화덕: 부탄가스나 나무판을 땐다), 길에서는 가방(+휴대용 버너와 부탄가스, 소리 남).
   부탄가스 1통 = 요리 3번(G.gas가 연 통에 남은 횟수), 나무판 1 = 1번(거점만). 처음 보는 제작법은 key 재료를 한 번 가져 봐야 열린다(G.seen) */
const seenMark=()=>{G.seen=G.seen||[];for(const st of [P.bag,G.stash])for(const k in st)if(st[k]&&!G.seen.includes(k))G.seen.push(k)};
const known=r=>!r.key||(G.seen||[]).includes(r.key);
const hasIn=(st,need)=>Object.entries(need).every(([k,v])=>(st[k]||0)>=v);
const fuelOk=(st,field)=>(G.gas||0)>0||st.butane>0||(!field&&st.wood>0);
function useFuel(st,field){if((G.gas||0)>0){G.gas--;return}if(st.butane>0){take(st,'butane');G.gas=2;return}if(!field&&st.wood>0)take(st,'wood')}
// 동료 기분(0~100, 처음 70). 30 아래면 아침 도움을 쉰다. 밤마다 +8. 개고기 요리·부대찌개·쑥떡에 반응한다
const moodOf=id=>(G.mood||(G.mood={}))[id]??70;
const DOG_TALK={malsun:[5,'옛날엔 다 먹었어. 남기지 말고.'],gangseok:[0,'먹어야 산다. 그게 다야.'],jisu:[0,'푹 익히기만 해. 덜 익은 건 안 돼.'],yuna:[-20,'…나 안 먹어. 말 걸지 마.'],doyun:[-8,'배달 가던 집에 개 키우던 애가 있었는데.']};
function crewReact(r,field){
  const who=field?(ALLY?[ALLY.id]:[]):crew();if(!who.length)return;
  const say=(id,d,t)=>{G.mood[id]=clamp(moodOf(id)+d,0,100);toast(`${SURV[id].n}: 「${t}」${d?` (기분 ${d>0?'+':''}${d})`:''}`,d<0?'red':d>0?'green':'')};
  if(r.dogd)for(const id of who){const [d,t]=DOG_TALK[id]||[0,'…'];say(id,d,t)}
  else if(r.out&&r.out.budae)for(const id of who)say(id,10,id==='yuna'?'부대찌개다! 라면사리 내 거.':'부대찌개 냄새 좋네.');
  else if(r.out&&r.out.ssukddeok&&who.includes('malsun'))say('malsun',5,'쑥은 이렇게 쪄야 향이 살지.');
}
function craftWhy(r,field){
  const st=field?P.bag:G.stash;
  if(field&&!r.hand)return '거점에서만';
  if(r.knife&&!st.knife)return '식칼 필요';
  if(r.fire&&field&&!st.burner)return '버너 필요';
  if(r.fire&&!fuelOk(st,field))return field?'부탄가스 필요':'연료(부탄가스·나무판) 필요';
  if(!hasIn(st,r.need))return '재료 부족';
  if(r.act==='repair'&&P.weapon.id==='fist')return '든 무기 없음';
  return '';
}
function craft(i,field){
  const r=RECIPES[i],st=field?P.bag:G.stash;if(craftWhy(r,field))return;
  if(r.act==='repair')P.weapon.dur=Math.min(WEAP[P.weapon.id].dur,P.weapon.dur+15);
  for(const k in r.need)take(st,k,r.need[k]);
  if(r.fire)useFuel(st,field);
  if(r.out)for(const k in r.out)addTo(st,k,r.out[k]);
  if(r.out&&r.out.ssukddeok&&!field&&crew().includes('malsun'))addTo(st,'ssukddeok');
  if(r.out&&r.out.bosin&&!field&&crew().includes('malsun'))addTo(st,'bosin');
  if(r.n==='들개 손질'&&field)noise(P.x,P.y,120,1,'200,60,60');
  crewReact(r,field);
  if(field){if(r.fire){noise(P.x,P.y,90,1,'255,170,80');for(let k=0;k<6;k++)fx.push({k:'spark',x:P.x,y:P.y-10,vx:(R()-.5)*50,vy:-40-R()*40,t:0,life:.6,col:'#ffb060'})}else noise(P.x,P.y,30,0)}
  toast(`${r.n} 완료${r.fire&&field?' · 불 냄새가 퍼진다':''}`,'green');seenMark();
  if(field)renderInv();else renderBase();
}
function craftList(field){
  seenMark();const st=field?P.bag:G.stash,cat=field?null:(G.ccat||'food');
  const rows=RECIPES.map((r,i)=>[r,i]).filter(([r])=>(field?r.hand:r.c===cat));
  const chip=(k,v)=>{const h=st[k]||0;return `<span class="chip${h>=v?'':' lack'}">${ITEMS[k].ic}${ITEMS[k].n} ${h}/${v}</span>`};
  const unk=rows.filter(([r])=>!known(r)),keys=[...new Set(unk.map(([r])=>ITEMS[r.key].n))];
  return `<div class="list craft">${rows.filter(([r])=>known(r)).map(([r,i])=>{

}
const fuelText=st=>`연료: 연 부탄가스 ${G.gas||0}번 · 부탄가스 ${st.butane||0} · 나무판 ${st.wood||0}`;
// 상함: 잘 때마다 확인. 처음 잠잘 때 「들인 날」을 적고, rot일 지나면 그 종류(가방+창고)가 모두 상한 음식으로 바뀐다
function rotLeft(id){const it=ITEMS[id];if(!it.rot)return null;const a=(G.age||{})[id];return a==null?it.rot+1:Math.max(1,it.rot+1-(G.day-a))}
const rotText=id=>`${rotLeft(id)}밤 지나면 상함`;
function spoilTick(log){
  G.age=G.age||{};
  for(const id in ITEMS){const it=ITEMS[id];if(!it.rot)continue;const n=(P.bag[id]||0)+(G.stash[id]||0);
    if(!n){delete G.age[id];continue}
    if(G.age[id]==null){G.age[id]=G.day;continue}
    if(G.day-G.age[id]>=it.rot){for(const st of [P.bag,G.stash])if(st[id]){addTo(st,'rotten',st[id]);delete st[id]}delete G.age[id];log.push(`<span class="no">${it.n} ${n}개가 상했다</span>`)}
  }
}
function equip(k){
  if(!G.stash[k])return;take(G.stash,k);
  const old=P.weapon.id;if(old!=='fist'&&P.weapon.dur>WEAP[old].dur/2)addTo(G.stash,old);
  P.weapon={id:k,dur:WEAP[k].dur};toast(`${WEAP[k].n} 장착`,'green');renderBase();
}
function build(id){
  G.fac[id]=G.fac[id]||0;const nd=facNeed(id);if(!has(nd)||G.fac[id]>=FACS[id].max)return;
  for(const k in nd)take(G.stash,k,nd[k]);G.fac[id]++;toast(`${FACS[id].n} Lv${G.fac[id]} 완료`,'gold');renderBase();
}
function pack(id,d){
  if(d>0&&G.stash[id]&&canCarry(id)){take(G.stash,id);addTo(P.bag,id)}
  else if(d<0&&P.bag[id]){take(P.bag,id);addTo(G.stash,id)}
  renderBase();
}
function sleep(){
  const log=[],day=G.day;G.nest={};HORDE=[];
  if(G.fac.smoke){let n=0;for(const k of ['dogmeat','ratmeat','birdmeat','fish'])while(n<3&&G.stash[k]){take(G.stash,k);n++}if(n){addTo(G.stash,'jerky',n);log.push(`훈연기: 육포 +${n}`)}}
  spoilTick(log);
  const fed=crewSleep(log);for(const id of [...fed])if(moodOf(id)<30){fed.delete(id);log.push(`<span class="no">${SURV[id].n}: 기분이 상해 오늘은 돕지 않는다 (기분 ${moodOf(id)})</span>`)}
  for(const id of crew())G.mood[id]=Math.min(100,moodOf(id)+8);
  const hunger=fed.has('malsun')?18:25;
  P.food-=hunger;P.water-=25;
  if(P.food<0){P.hp+=P.food;P.food=0;log.push('<span class="no">굶주려 체력이 깎였다</span>')}
  if(P.water<0){P.hp+=P.water;P.water=0;log.push('<span class="no">목이 말라 체력이 깎였다</span>')}
  const heal=15+(fed.has('jisu')?10:0);P.hp=Math.min(100,P.hp+heal);
  if(P.inf>0){const inc=fed.has('jisu')?1:5;P.inf=Math.min(100,P.inf+inc);log.push(`감염이 조금 더 퍼졌다 (+${inc})${inc<5?' · 한지수가 치료했다':''}`)}
  if(day%3===0){
    const s=Math.ceil(day/3);
    if(G.fac.barr+(fed.has('gangseok')?1:0)>=s)log.push(`🛡 밤사이 좀비 무리가 1층을 두드렸지만 바리케이드가 버텼다`);
    else{
      const soft=G.fac.barr>=4;let lost=0;for(const k of ['can','ramen','veg','water']){const n=G.stash[k]||0,l=Math.ceil(n*(G.fac.barr>=5?.2:.4));if(l){take(G.stash,k,l);lost+=l}}
      P.hp-=soft?8:15;if(soft)log.push('공사장 펜스가 무리를 늦춰 피해가 줄었다');log.push(`<span class="no">⚠ 밤 습격! 바리케이드가 뚫려 식량·물 ${lost}개를 잃고 다쳤다 (Lv${s} 필요)</span>`);
    }
  }
  if(G.fac.rain){const n=G.fac.rain*(G.rain?2:1);addTo(G.stash,'water',n);log.push(`빗물 받이: 생수 +${n}${G.rain?' (비 온 날 두 배)':''}`)}
  if(G.fac.garden){addTo(G.stash,'veg',G.fac.garden);log.push(`옥상 텃밭: 채소 +${G.fac.garden}`)}
  if(G.fac.ratfarm){addTo(G.stash,'rat');log.push('쥐 사육장: 쥐 +1');if(R()<.15){P.inf=Math.min(100,P.inf+3);log.push('<span class="no">사육장 냄새에 잔기침이 난다 (감염 +3)</span>')}}
  crewMorning(fed,log);
  G.day++;G.t=0;G.warned=G.warn0=0;G.spT=0;P.lightManual=false;G.rain=R()<.3;
  for(const c of conts)if(c.empty&&R()<.3){c.empty=false;c.loot=null}
  for(const id in ZC)if(id!==G.zone)for(const c of ZC[id].conts)if(c.empty&&R()<.3){c.empty=false;c.loot=null}
  for(const k in G.floors){const f=G.floors[k];f.Z=null;if(f.conts)for(const c of f.conts)if(c.empty&&R()<.3){c.empty=false;c.loot=null}}
  for(const car of cars)car.fired=false;
  noises=[];thrown=[];alarms=[];fx=[];
  spawnDay();
  if(P.hp<=0){gameOver('hp');return}
  if(P.inf>=100){gameOver('inf');return}
  saveGame();
  const m=$('#modal');
  m.innerHTML=`<div class="win"><div class="whead"><div><h2>${day}일차 밤이 지났다</h2><small>${G.day}일차 아침 06:00</small></div></div><div class="wbody"><div class="list">${[`배고픔 −${hunger} · 갈증 −25 · 체력 +${heal}`,...log].map(s=>`<div class="it">${s}</div>`).join('')}</div></div><div class="wfoot"><button class="pri" onclick="renderBase();morningSms()">확인</button></div></div>`;
  m.classList.add('on');
}

/* ───────── 저장·불러오기 ─────────
   브라우저 localStorage 한 칸. 지도는 seed로 다시 만들고, 바뀐 것(창고·가방·뒤진 상자·경보 울린 차·층별 상자)만 저장한다.
   좀비 위치는 저장하지 않는다(불러오면 그날 수만큼 다시 퍼진다). 죽거나 구조 신호를 보내면 저장을 지운다.
   v2: 구역마다 zones[id]={conts,cars}(인덱스 순서). v1 저장은 강남 하나로 읽는다. */
const SAVE_KEY='seoul-survivor-save-v1';
function readSave(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY));return d&&(d.v===1||d.v===2)?d:null}catch(e){return null}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
function zoneLists(id){
  if(id===G.zone)return G.area?STREET:{conts,cars};
  return ZC[id]||null;
}
function saveGame(){
  if(!G||G.state==='over'||!P)return false;
  try{
    if(G.area)saveFloor();
    const floors=Object.assign({},G.floorSave||{});
    for(const k in G.floors){const f=G.floors[k];if(f.conts)floors[k]=f.conts.map(c=>[c.empty?1:0,c.loot])}
    const zones=Object.assign({},G.zoneSave||{});
    for(const id in ZONES){const L=zoneLists(id);if(L)zones[id]={conts:L.conts.map(c=>[c.empty?1:0,c.loot]),cars:L.cars.map(c=>c.fired?1:0)}}
    const d={v:2,at:Date.now(),
      G:{day:G.day,t:G.t,seed:G.seed,stash:G.stash,fac:G.fac,kills:G.kills,warned:G.warned||0,warn0:G.warn0||0,rain:!!G.rain,seenBri:G.seenBri||0,surv:G.surv,follow:G.follow||null,zone:G.zone,seenSub:G.seenSub||0,seenNam:G.seenNam||0,nest:G.nest||{},age:G.age||{},gas:G.gas||0,seen:G.seen||[],mood:G.mood||{}},
      P:{x:P.x,y:P.y,fx:P.fx,fy:P.fy,hp:P.hp,food:P.food,water:P.water,inf:P.inf,weapon:{id:P.weapon.id,dur:P.weapon.id==='fist'?0:P.weapon.dur},bag:P.bag,eq:P.eq,bat:P.bat,lay:P.lay},
      zones,floors,area:G.area?{bx:G.area.b.x,by:G.area.b.y,f:G.area.f}:null,base:G.state==='base'};
    localStorage.setItem(SAVE_KEY,JSON.stringify(d));G.saveT=15;return true;
  }catch(e){return false}
}
function loadGame(){
  const d=readSave();if(!d){newGame();return}
  newGame();
  const zones=d.v===1?{gangnam:{conts:d.conts,cars:d.cars}}:d.zones;
  Object.assign(G,d.G,{floors:{},area:null,floorSave:d.floors||{},zoneSave:zones||{},saveT:15,zone:'gangnam',final:null});
  G.fac=Object.assign({rain:0,garden:0,barr:0,smoke:0,ratfarm:0},G.fac);G.mood=G.mood||{};
  ZC={};zoneGen('gangnam');if(!d.G.surv)placeSurvivors();
  Object.assign(P,d.P,{bag:d.P.bag||{},search:null,eq:Object.assign({head:null,body:null,pack:null,light:'light'},d.P.eq||{}),bat:d.P.bat??70,lightOn:false,lightManual:false});
  if(P.weapon.id==='fist')P.weapon.dur=Infinity;
  const zid=d.G.zone||'gangnam';
  if(zid!=="gangnam"){Z=[];stashZone();ZC.gangnam.day=-1;zoneGen(zid);G.zone=zid}
  spawnZone(G.zone);
  if(d.area){const b=buildings.find(b=>b.x===d.area.bx&&b.y===d.area.by);if(b){enterFloor(b,d.area.f,false);P.x=d.P.x;P.y=d.P.y}}
  $('#toasts').innerHTML='';
  toast(`${G.day}일차 ${clockText()} · ${ZONES[G.zone].n} · 이어서 시작`,'gold');
  if(d.base)openBase();else spawnAlly();
}

function drawPlayer(){
  const x=P.x,y=P.y,moving=keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD||keys.ArrowUp||keys.ArrowDown||keys.ArrowLeft||keys.ArrowRight||joy.on||!!GO;
  if(ART.player){ctx.strokeStyle='rgba(120,220,255,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y+2,14,6,0,0,7);ctx.stroke();drawSheet('player',P,moving,P.hurt>0?.6:undefined);if(P.swing>0){const fa=Math.atan2(P.fy,P.fx),w=WEAP[P.weapon.id];ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y-14,w.reach,w.reach*.7,0,fa-1,fa+1);ctx.stroke()}return}
  const bob=moving?Math.sin(P.ph)*2:0,up=P.fy<-.35;
  ctx.fillStyle='rgba(0,0,0,.32)';ctx.beginPath();ctx.ellipse(x,y+2,10,4,0,0,7);ctx.fill();
  ctx.fillStyle='#2c3440';ctx.fillRect(x-5,y-7+Math.max(0,bob),4,9);ctx.fillRect(x+1,y-7+Math.max(0,-bob),4,9);
  const fa=Math.atan2(P.fy,P.fx),w=WEAP[P.weapon.id];
  const drawW=()=>{const sw=P.swing>0?(P.swing/.2-.5)*2.2:0,a=fa+sw,len=P.weapon.id==='fist'?8:w.reach*.42;
    ctx.strokeStyle=w.col;ctx.lineWidth=P.weapon.id==='fist'?5:3.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+P.fx*6,y-13);ctx.lineTo(x+P.fx*6+Math.cos(a)*len,y-13+Math.sin(a)*len*.75);ctx.stroke();
    if(P.swing>.05){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y-12,w.reach,w.reach*.7,0,fa-1,fa+1);ctx.stroke()}};
  if(up)drawW();
  if(!up){ctx.fillStyle='#5a4a33';ctx.fillRect(x-7-P.fx*3,y-22,14,12)}
  ctx.fillStyle=P.hurt>0?'#ff8a80':'#3d6a9e';ctx.beginPath();ctx.ellipse(x,y-13,8,9,0,0,7);ctx.fill();
  if(up){ctx.fillStyle='#5a4a33';ctx.fillRect(x-7,y-22,14,12)}
  ctx.fillStyle='#e0c09a';ctx.beginPath();ctx.arc(x,y-26,6.5,0,7);ctx.fill();
  ctx.fillStyle='#1f1a16';ctx.beginPath();ctx.arc(x,y-28-(up?-1:0),6.6,Math.PI*(up?0:1.05),Math.PI*(up?2:1.95));ctx.fill();
  if(up){ctx.beginPath();ctx.arc(x,y-27,6.5,0,7);ctx.fill()}
  if(!up)drawW();
  if(P.run){ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(x-P.fx*14-2,y-6,4,2)}
}
function drawFire(f){
  if(f.kind==='molotov'){if(f.st==='fly'){ctx.fillStyle='#6a8a5a';ctx.fillRect(f.x-2,f.y-9,5,9);ctx.fillStyle='#ffb04a';ctx.fillRect(f.x-1,f.y-12,3,3);return}
    const fl=.6+.4*Math.sin(performance.now()/60),g=ctx.createRadialGradient(f.x,f.y,4,f.x,f.y,62);g.addColorStop(0,`rgba(255,180,80,${.55*fl})`);g.addColorStop(.6,`rgba(255,90,30,${.35*fl})`);g.addColorStop(1,'rgba(255,60,20,0)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(f.x,f.y,62,40,0,0,7);ctx.fill();return}
  if(f.kind==='bomb'){ctx.fillStyle='#c9ccd2';ctx.fillRect(f.x-4,f.y-10,8,11);ctx.fillStyle='#d04030';ctx.fillRect(f.x-4,f.y-7,8,3);if(f.st==='fuse'&&Math.sin(performance.now()/(f.life<.6?40:110))>0){ctx.fillStyle='#ff3a2a';ctx.beginPath();ctx.arc(f.x,f.y-13,3,0,7);ctx.fill()}return}
  ctx.fillStyle='#c33';ctx.fillRect(f.x-3,f.y-6,6,8);
  if(f.st==='burn'){const g=ctx.createRadialGradient(f.x,f.y-4,2,f.x,f.y-4,40);g.addColorStop(0,'rgba(255,210,120,.5)');g.addColorStop(1,'rgba(255,120,40,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y-4,40,0,7);ctx.fill()}
}

/* ───────── 루프 ───────── */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  // 창을 닫을 때 last를 performance.now()로 맞추면 이번 프레임 시각보다 늦을 수 있어 음수가 되지 않게 막는다
  const dt=clamp((now-last)/1000,0,.05);last=Math.max(last,now);
  try{
    if(G&&G.state==='field')update(dt);
    render();
    hudT-=dt;if(G&&hudT<=0){hudT=.1;hud()}
  }catch(e){console.error(e)}
}
titleScreen();
load3D();
requestAnimationFrame(loop);
</script>
